# Prueft, ob die ausgelieferte Oberflaeche tatsaechlich startet.
#
# Das kann `npm run check` nicht: die Arbeitsumgebung erreicht weder die CDNs
# noch netlify.app. Der Rauchtest dort prueft Struktur, nicht Verhalten, und
# sagt das auch. Hier laeuft ein echter Browser gegen die ausgelieferte
# Adresse und meldet, was in der Konsole steht.
#
# Aufbau: jeder Schritt schreibt sein Ergebnis in eine Datei, ein letzter
# Schritt gibt alle zusammen aus. Grund: der Browser-Download schreibt
# hunderte Fortschrittszeilen ins Protokoll, und was davor stand, ist danach
# praktisch nicht mehr zu finden.
name: Oberflaeche pruefen

on:
  workflow_dispatch:
    inputs:
      adresse:
        description: 'Adresse der ausgelieferten Oberflaeche'
        required: true
        default: 'https://immoofficeeai.netlify.app'
      konto:
        description: 'E-Mail fuer den Anmeldeversuch (leer = nur laden)'
        required: false
        default: ''
      passwort:
        description: 'Passwort dazu. Nur Wegwerf-Zugaenge hier eintragen — der Wert steht im Protokoll der Oberflaeche.'
        required: false
        default: ''

jobs:
  pruefen:
    # Feste Abbildung statt ubuntu-latest. Zwei Gruende, beide am 05.10.2026
    # aufgefallen: die Laeufe 55 bis 57 sind nacheinander mit
    #   The job was not acquired by Runner of type hosted even after
    #   multiple attempts
    # gestorben, ohne einen einzigen Schritt — kein Fehler am Inhalt, sondern
    # keine Maschine aus dem Topf von ubuntu-latest. Und GitHub stellt dieses
    # Etikett ab dem 19.10.2026 auf Ubuntu 26 um; ein Bau, der sich ueber
    # Nacht aendert, ist kein Bau.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Sind die CDN-Adressen erreichbar?
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p befund
          # Genau die Adressen, die die gebaute Datei laedt — aus ihr geholt,
          # nicht abgeschrieben.
          python3 scripts/bauen.py > /dev/null
          # Nur, was die Seite tatsaechlich LAEDT. <link rel="preconnect">
          # nennt einen Host ohne Pfad — der antwortet naturgemaess mit 404
          # und ist trotzdem in Ordnung. Beim ersten Lauf hat genau das zwei
          # Fehlalarme erzeugt.
          { grep -o '<script[^>]*src="https://[^"]*"' dist/index.html | sed 's/.*src="//;s/"//'
            grep -o '<link[^>]*rel="stylesheet"[^>]*href="https://[^"]*"' dist/index.html | sed 's/.*href="//;s/"//'
            grep -o '<link[^>]*href="https://[^"]*"[^>]*rel="stylesheet"' dist/index.html | sed 's/.*href="//;s/".*//'
          } | sort -u > adressen.txt
          : > befund/cdn.txt
          while read -r u; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' -L --max-time 30 "$u" || echo 000)"
            [ "$code" = "200" ] || printf '%s  %s\n' "$code" "$u" >> befund/cdn.txt
          done < adressen.txt
          echo "$(wc -l < adressen.txt) Adressen geprueft, $(wc -l < befund/cdn.txt) nicht erreichbar."

      - name: Liefert Netlify die sechs Dateien?
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p befund
          U='${{ github.event.inputs.adresse }}'
          : > befund/dateien.txt
          # _redirects steht bewusst nicht in der Liste: Netlify wertet die
          # Datei aus und liefert sie nicht aus. Ein 404 darauf ist richtig.
          for p in "" /sw.js /freigabe.html /objekt.html /sonnenverlauf.html; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' -L --max-time 30 "$U$p" || echo 000)"
            printf '%s  %s\n' "$code" "${p:-/}" >> befund/dateien.txt
          done
          cat befund/dateien.txt

      - name: Startet die Anwendung wirklich?
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p befund
          # In einem EIGENEN Verzeichnis: im Repo liegt eine andere
          # Playwright-Fassung, deren Binaerdatei die installierte
          # ueberschattet — der Starter laedt dann Browser, die die
          # Bibliothek nicht kennt ("Executable doesn't exist at
          # .../chromium_headless_shell-1148").
          mkdir -p /tmp/pw && cd /tmp/pw
          npm init -y > /dev/null
          npm install playwright > /dev/null 2>&1
          ./node_modules/.bin/playwright install --with-deps chromium > /dev/null 2>&1
          cat > pruefen.mjs <<'ENDE'
          import { chromium } from 'playwright';
          const url = process.argv[2];
          const browser = await chromium.launch();
          const seite = await browser.newPage();
          const konsole = [], fehler = [], gescheitert = [];
          seite.on('console', m => { if (m.type() === 'error') konsole.push(m.text()); });
          seite.on('pageerror', e => fehler.push(String(e)));
          seite.on('requestfailed', r =>
            gescheitert.push(`${r.url()} — ${r.failure()?.errorText}`));
          seite.on('response', r => {
            if (r.status() >= 400) gescheitert.push(`${r.status()} ${r.url()}`);
          });
          await seite.goto(url, { waitUntil: 'load', timeout: 60000 });
          await seite.waitForTimeout(12000);

          // Anmeldung durchspielen, wenn ein Zugang mitgegeben wurde. Das ist
          // der eigentliche Nachweis: startet die Anwendung GEGEN DAS EIGENE
          // Projekt, oder nur als Huelle?
          const konto = process.argv[3] || '', passwort = process.argv[4] || '';
          if (konto && passwort) {
            try {
              await seite.fill('input[type="email"]', konto);
              await seite.fill('input[type="password"]', passwort);
              await seite.click('button:has-text("ANMELDEN"), button:has-text("Anmelden")');
              await seite.waitForTimeout(15000);
              console.log('Anmeldung ausgeloest.');
            } catch (e) {
              console.log('Anmeldung nicht moeglich: ' + e.message.split('\n')[0]);
            }
          }

          const w = await seite.evaluate(() => {
            const r = document.getElementById('root');
            return { kinder: r ? r.children.length : -1,
                     text: (document.body.innerText || '').slice(0, 300) };
          });
          console.log('Titel: ' + (await seite.title()));
          console.log('Kinder unter #root: ' + w.kinder);
          console.log('--- sichtbarer Text ---');
          console.log(w.text || '(leer)');
          for (const [t, l] of [['Skriptfehler', fehler], ['Konsole (error)', konsole],
                                ['Gescheiterte Anfragen', gescheitert]]) {
            console.log(`--- ${t}: ${l.length}`);
            [...new Set(l)].slice(0, 12).forEach(z => console.log('    ' + z));
          }
          await browser.close();
          ENDE
          node pruefen.mjs '${{ github.event.inputs.adresse }}' \
            '${{ github.event.inputs.konto }}' '${{ github.event.inputs.passwort }}' \
            > "$GITHUB_WORKSPACE/befund/browser.txt" 2>&1 || true
          tail -5 "$GITHUB_WORKSPACE/befund/browser.txt"

      - name: Befund
        if: always()
        run: |
          set -uo pipefail
          echo '════════ CDN-Adressen, die nicht mit 200 antworten ════════'
          if [ -s befund/cdn.txt ]; then cat befund/cdn.txt; else echo '(keine — alle erreichbar)'; fi
          echo
          echo '════════ Von Netlify ausgelieferte Dateien ════════'
          cat befund/dateien.txt 2>/dev/null || echo '(nicht geprueft)'
          echo
          echo '════════ Was der Browser sieht ════════'
          cat befund/browser.txt 2>/dev/null || echo '(nicht geprueft)'
          echo
          if [ -s befund/cdn.txt ]; then
            echo '::error::Mindestens eine CDN-Adresse antwortet nicht mit 200.'
            exit 1
          fi
