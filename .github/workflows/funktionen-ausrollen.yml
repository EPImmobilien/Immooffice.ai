# Rollt die Edge Functions aus supabase/functions/ auf das eigene Projekt aus.
#
# Warum ueber GitHub Actions und nicht aus der Arbeitsumgebung heraus: der
# Netzfilter der Arbeitsumgebung beantwortet jede Verbindung zu
# api.supabase.com mit 403. Die Supabase-CLI ist dort damit ausgeschlossen,
# und es bleibt nur der Weg ueber ein Werkzeug, das jede Datei einzeln
# uebertraegt. Ein Actions-Runner hat freien Ausgang: er ueberreicht die
# Dateien so, wie sie im Repository liegen — byte-genau, ohne Abschrift.
#
# Voraussetzung: das Repository-Geheimnis SUPABASE_ACCESS_TOKEN. Es entsteht
# unter https://supabase.com/dashboard/account/tokens ("Generate new token")
# und gehoert in Settings > Secrets and variables > Actions > New repository
# secret. Es ist ein PERSOENLICHES Zugangstoken fuer die Verwaltungs-API,
# nicht der anon- oder service_role-Schluessel des Projekts.
#
# Wird von Hand gestartet (Actions > Edge Functions ausrollen > Run workflow)
# und laeuft ausserdem bei jeder Aenderung an den Funktionen auf dem
# Entwicklungszweig.
name: Edge Functions ausrollen

on:
  workflow_dispatch:
    inputs:
      funktion:
        description: 'Nur diese eine Funktion ausrollen (leer = alle)'
        required: false
        default: ''
  push:
    branches: ['claude/**']
    paths: ['supabase/functions/**']

concurrency:
  group: funktionen-ausrollen
  cancel-in-progress: false

jobs:
  ausrollen:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJEKT: usguiggfciavwzkdfjgt
    steps:
      - uses: actions/checkout@v4

      - name: Zugangstoken vorhanden?
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Das Repository-Geheimnis SUPABASE_ACCESS_TOKEN fehlt."
            echo "Anlegen unter https://supabase.com/dashboard/account/tokens,"
            echo "eintragen unter Settings > Secrets and variables > Actions."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest
        env:
          # Die Action fragt GitHub nach der neuesten Fassung. Unangemeldet
          # laeuft sie dabei ins Rate-Limit des Runners ("Failed to resolve
          # latest Supabase CLI release: rate limit exceeded") — passiert am
          # 28.09.2026 beim ersten Lauf. Mit Token zaehlt die Anfrage auf ein
          # eigenes, viel groesseres Kontingent.
          GITHUB_TOKEN: ${{ github.token }}

      - name: Ausrollen
        run: |
          set -uo pipefail
          # --use-api laesst Supabase buendeln. Ohne das braucht die CLI
          # Docker, und der Runner soll nichts bauen, was er nicht muss.
          gemeinsam="--project-ref $PROJEKT --use-api"

          if [ -n "${{ github.event.inputs.funktion }}" ]; then
            supabase functions deploy "${{ github.event.inputs.funktion }}" $gemeinsam
            exit $?
          fi

          # Jede Funktion einzeln: so nennt das Protokoll bei einem Fehler den
          # Namen, und die uebrigen laufen weiter. Am Ende wird gezaehlt.
          gut=0; schlecht=0; fehlerhafte=""
          for d in supabase/functions/*/; do
            name="$(basename "$d")"
            echo "::group::$name"
            if supabase functions deploy "$name" $gemeinsam; then
              gut=$((gut + 1))
            else
              schlecht=$((schlecht + 1)); fehlerhafte="$fehlerhafte $name"
            fi
            echo "::endgroup::"
          done

          echo "Ausgerollt: $gut, fehlgeschlagen: $schlecht"
          if [ "$schlecht" -gt 0 ]; then
            echo "::error::Fehlgeschlagen:$fehlerhafte"
            exit 1
          fi

      - name: Nachzaehlen
        run: |
          set -euo pipefail
          # Die Gegenprobe gehoert hierher und nicht in die Arbeitsumgebung:
          # hier laeuft die CLI, und die Antwort ist eine Zeile statt 139
          # Datensaetzen.
          supabase functions list --project-ref "$PROJEKT" -o json > ist.json
          python3 - <<'ENDE'
          import json, sys, tomllib
          with open('supabase/config.toml', 'rb') as f:
              soll = {n: v['verify_jwt'] for n, v in tomllib.load(f)['functions'].items()}
          ist = {f['name']: f['verify_jwt'] for f in json.load(open('ist.json'))
                 if f.get('status') != 'REMOVED'}
          fehlt  = sorted(set(soll) - set(ist))
          fremd  = sorted(set(ist) - set(soll))
          falsch = sorted(n for n in set(soll) & set(ist) if soll[n] != ist[n])
          print(f'Soll {len(soll)}, ausgerollt {len(ist)}')
          schlecht = False
          for titel, liste in (('fehlen im Projekt', fehlt),
                               ('im Projekt, aber nicht im Repository', fremd),
                               ('falsches verify_jwt', falsch)):
              if liste:
                  schlecht = True
                  print(f'::error::{len(liste)} {titel}: ' + ', '.join(liste[:20]))
          if schlecht:
              sys.exit(1)
          offen = sum(1 for v in soll.values() if not v)
          print(f'Alle {len(soll)} Funktionen ausgerollt, verify_jwt stimmt '
                f'ueberall ({offen} ohne JWT-Pruefung).')
          ENDE
