# Rollt die Edge Functions aus supabase/functions/ auf das eigene Projekt aus.
#
# Warum ueber GitHub Actions und nicht aus der Arbeitsumgebung heraus: der
# Netzfilter der Arbeitsumgebung beantwortet jede Verbindung zu
# api.supabase.com mit 403. Die Supabase-CLI ist dort damit ausgeschlossen,
# und es bleibt nur der Weg ueber ein Werkzeug, das jede Datei einzeln
# uebertraegt. Ein Actions-Runner hat freien Ausgang: er ueberreicht die
# Dateien so, wie sie im Repository liegen — byte-genau, ohne Abschrift.
#
# Voraussetzung: das Repository-Geheimnis SUPABASE_ACCESS_TOKEN. Es entsteht
# unter https://supabase.com/dashboard/account/tokens ("Generate new token")
# und gehoert in Settings > Secrets and variables > Actions > New repository
# secret. Es ist ein PERSOENLICHES Zugangstoken fuer die Verwaltungs-API,
# nicht der anon- oder service_role-Schluessel des Projekts.
#
# Wird von Hand gestartet (Actions > Edge Functions ausrollen > Run workflow)
# und laeuft ausserdem bei jeder Aenderung an den Funktionen auf dem
# Entwicklungszweig.
name: Edge Functions ausrollen

on:
  workflow_dispatch:
    inputs:
      funktion:
        description: 'Nur diese eine Funktion ausrollen (leer = alle)'
        required: false
        default: ''
      loeschen:
        description: 'Diese Funktion(en) vom Projekt ENTFERNEN, durch Komma oder Leerzeichen getrennt. Nur von Hand, nie automatisch.'
        required: false
        default: ''
  push:
    branches: ['claude/**']
    paths: ['supabase/functions/**']

concurrency:
  group: funktionen-ausrollen
  cancel-in-progress: false

jobs:
  ausrollen:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJEKT: usguiggfciavwzkdfjgt
    steps:
      - uses: actions/checkout@v4

      - name: Zugangstoken vorhanden?
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Das Repository-Geheimnis SUPABASE_ACCESS_TOKEN fehlt."
            echo "Anlegen unter https://supabase.com/dashboard/account/tokens,"
            echo "eintragen unter Settings > Secrets and variables > Actions."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest
        env:
          # Die Action fragt GitHub nach der neuesten Fassung. Unangemeldet
          # laeuft sie dabei ins Rate-Limit des Runners ("Failed to resolve
          # latest Supabase CLI release: rate limit exceeded") — passiert am
          # 28.09.2026 beim ersten Lauf. Mit Token zaehlt die Anfrage auf ein
          # eigenes, viel groesseres Kontingent.
          GITHUB_TOKEN: ${{ github.token }}

      # Absichtlich NUR bei workflow_dispatch und nur mit ausdruecklich
      # eingetragenem Namen. Kein Abgleich, der von selbst aufraeumt: was auf
      # dem Projekt liegt und nicht im Repository steht, meldet der Schritt
      # "Nachzaehlen" — entfernt wird es von Hand, mit Blick auf den Namen.
      - name: Funktion entfernen
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.loeschen != ''
        env:
          LOESCHEN: ${{ github.event.inputs.loeschen }}
        run: |
          set -euo pipefail
          # Mehrere Namen sind erlaubt, durch Komma oder Leerzeichen getrennt:
          # nach dem Ausbau von onOffice lagen 21 gestrichene Funktionen auf
          # dem Projekt. Einundzwanzig Laeufe von Hand waeren die Art Arbeit,
          # bei der man beim achtzehnten aufhoert. Die Schranke bleibt
          # dieselbe — von Hand angestossen, und was im Repository liegt,
          # wird nicht entfernt.
          #
          # Der Name kommt ueber die Umgebung, nicht ueber eine Ersetzung
          # in der Zeile: sonst schriebe GitHub die Eingabe woertlich in das
          # Skript, und wer den Lauf starten darf, koennte Befehle
          # einschleusen.
          #
          # Und der Grund, warum hier keine leere Ersetzung als Beispiel
          # steht: GitHub liest Ersetzungen auch in Kommentaren. Eine leere
          # ist keine gueltige, und die ganze Datei gilt als ungueltig — der
          # Lauf bricht nach null Sekunden ohne einen einzigen Job ab.
          # Passiert am 28.09.2026, Lauf 17.
          namen="$(printf '%s' "$LOESCHEN" | tr ',' ' ')"
          for name in $namen; do
            case "$name" in
              */*|.*|*' '*) echo "::error::Unzulaessiger Name: $name"; exit 1 ;;
            esac
            if [ -d "supabase/functions/$name" ]; then
              echo "::error::$name liegt im Repository. Erst dort entfernen, sonst rollt der naechste Lauf sie wieder aus."
              exit 1
            fi
          done
          set +e
          schlecht=""
          for name in $namen; do
            if supabase functions delete "$name" --project-ref "$PROJEKT" --yes; then
              echo "$name vom Projekt entfernt."
            else
              schlecht="$schlecht $name"
            fi
          done
          if [ -n "$schlecht" ]; then
            echo "::error::Nicht entfernt:$schlecht"
            exit 1
          fi

      - name: Ausrollen
        if: github.event.inputs.loeschen == ''
        run: |
          set -uo pipefail
          # --use-api laesst Supabase buendeln. Ohne das braucht die CLI
          # Docker, und der Runner soll nichts bauen, was er nicht muss.
          gemeinsam="--project-ref $PROJEKT --use-api"

          if [ -n "${{ github.event.inputs.funktion }}" ]; then
            supabase functions deploy "${{ github.event.inputs.funktion }}" $gemeinsam
            exit $?
          fi

          # Jede Funktion einzeln: so nennt das Protokoll bei einem Fehler den
          # Namen, und die uebrigen laufen weiter. Am Ende wird gezaehlt.
          #
          # Bis zu drei Versuche je Funktion. Grund: am 30.09.2026 ist
          # mail-anhaenge-diagnose zweimal hintereinander mit
          #   unexpected deploy status 500: Function deploy failed due to an
          #   internal error
          # stehengeblieben — waehrend dieselbe Datei kurz davor und kurz
          # danach durchging. Die Funktion bindet imagescript und pdfjs-dist
          # ein; das Buendeln geschieht bei --use-api auf der Gegenseite, und
          # dort scheitert es gelegentlich. Ein einzelner Fehlversuch hat
          # damit den ganzen Lauf rot gemacht, obwohl nichts kaputt war.
          #
          # Drei Versuche mit Pause davor, nicht mehr: eine wirklich kaputte
          # Funktion faellt dreimal durch und wird weiter gemeldet. Die
          # Wiederholung verdeckt also keinen echten Fehler, sie ueberbrueckt
          # nur einen fremden.
          gut=0; schlecht=0; fehlerhafte=""; wiederholt=""
          for d in supabase/functions/*/; do
            name="$(basename "$d")"
            echo "::group::$name"
            erfolg=0
            for versuch in 1 2 3; do
              if [ "$versuch" -gt 1 ]; then
                echo "Versuch $versuch fuer $name nach kurzer Pause …"
                sleep $((versuch * 10))
              fi
              if supabase functions deploy "$name" $gemeinsam; then
                erfolg=1
                [ "$versuch" -gt 1 ] && wiederholt="$wiederholt $name($versuch)"
                break
              fi
            done
            if [ "$erfolg" -eq 1 ]; then
              gut=$((gut + 1))
            else
              schlecht=$((schlecht + 1)); fehlerhafte="$fehlerhafte $name"
            fi
            echo "::endgroup::"
          done

          if [ -n "$wiederholt" ]; then
            echo "::warning::Erst nach Wiederholung ausgerollt:$wiederholt"
          fi

          echo "Ausgerollt: $gut, fehlgeschlagen: $schlecht"
          if [ "$schlecht" -gt 0 ]; then
            echo "::error::Fehlgeschlagen:$fehlerhafte"
            exit 1
          fi

      - name: Nachzaehlen
        run: |
          set -euo pipefail
          # Die Gegenprobe gehoert hierher und nicht in die Arbeitsumgebung:
          # hier laeuft die CLI, und die Antwort ist eine Zeile statt 139
          # Datensaetzen.
          supabase functions list --project-ref "$PROJEKT" -o json > ist.json
          python3 - <<'ENDE'
          import json, sys, tomllib
          with open('supabase/config.toml', 'rb') as f:
              soll = {n: v['verify_jwt'] for n, v in tomllib.load(f)['functions'].items()}
          ist = {f['name']: f['verify_jwt'] for f in json.load(open('ist.json'))
                 if f.get('status') != 'REMOVED'}
          fehlt  = sorted(set(soll) - set(ist))
          fremd  = sorted(set(ist) - set(soll))
          falsch = sorted(n for n in set(soll) & set(ist) if soll[n] != ist[n])
          print(f'Soll {len(soll)}, ausgerollt {len(ist)}')
          schlecht = False
          for titel, liste in (('fehlen im Projekt', fehlt),
                               ('im Projekt, aber nicht im Repository', fremd),
                               ('falsches verify_jwt', falsch)):
              if liste:
                  schlecht = True
                  print(f'::error::{len(liste)} {titel}: ' + ', '.join(liste[:20]))
          if schlecht:
              sys.exit(1)
          offen = sum(1 for v in soll.values() if not v)
          print(f'Alle {len(soll)} Funktionen ausgerollt, verify_jwt stimmt '
                f'ueberall ({offen} ohne JWT-Pruefung).')
          ENDE
