# Baut dist/ aus src/ und stellt es auf eine Netlify-Site.
#
# Warum hier und nicht aus der Arbeitsumgebung: derselbe Grund wie beim
# Ausrollen der Edge Functions — der Netzfilter dort laesst weder Netlify noch
# die CDNs durch. Ein Runner kann beides.
#
# Voraussetzung: zwei Repository-Geheimnisse.
#   NETLIFY_AUTH_TOKEN  Netlify > User settings > Applications >
#                       Personal access tokens > New access token
#   NETLIFY_SITE_ID     Netlify > die Site > Site configuration > Site ID
#
# WICHTIG: Die Site muss dem Fork gehoeren. Die netlify.toml im Wurzelverzeichnis
# richtet den Next.js-ALTBESTAND ein (publish = ".next", Next-Plugin) — ein
# anderes Produkt. Deshalb wird hier aus einem eigenen Verzeichnis ohne
# netlify.toml ausgeliefert: so greift keine dieser Einstellungen.
#
# Standardmaessig entsteht ein ENTWURF mit eigener Adresse. Die Produktion
# will ausdruecklich angefordert werden.
name: Oberflaeche ausliefern

on:
  workflow_dispatch:
    inputs:
      umgebung:
        description: 'entwurf (eigene Vorschau-Adresse) oder produktion'
        required: true
        default: entwurf
        type: choice
        options: [entwurf, produktion]

concurrency:
  group: oberflaeche-ausliefern
  cancel-in-progress: false

jobs:
  ausliefern:
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Zugangsdaten vorhanden?
        run: |
          fehlt=""
          [ -z "$NETLIFY_AUTH_TOKEN" ] && fehlt="$fehlt NETLIFY_AUTH_TOKEN"
          [ -z "$NETLIFY_SITE_ID" ]    && fehlt="$fehlt NETLIFY_SITE_ID"
          if [ -n "$fehlt" ]; then
            echo "::error::Es fehlen die Repository-Geheimnisse:$fehlt"
            echo "Anzulegen unter Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Bauen
        run: |
          set -euo pipefail
          # Die beiden oeffentlichen Werte stehen genau einmal im Repository:
          # in netlify.toml, mit der Begruendung daneben. Von dort geholt und
          # nicht ein zweites Mal hinterlegt — zwei Quellen laufen auseinander.
          eval "$(python3 - <<'ENDE'
          import shlex, sys, tomllib
          with open('netlify.toml', 'rb') as f:
              u = tomllib.load(f)['build']['environment']
          try:
              url, key = u['NEXT_PUBLIC_SUPABASE_URL'], u['NEXT_PUBLIC_SUPABASE_ANON_KEY']
          except KeyError:
              sys.exit('::error::netlify.toml fuehrt NEXT_PUBLIC_SUPABASE_URL '
                       'oder NEXT_PUBLIC_SUPABASE_ANON_KEY nicht mehr. Die '
                       'Oberflaeche holt beides von dort.')
          print(f'export IMMO_SUPABASE_URL={shlex.quote(url)}')
          print(f'export IMMO_SUPABASE_KEY={shlex.quote(key)}')
          ENDE
          )"
          python3 scripts/bauen.py
          python3 tests/oberflaeche-rauchtest.py

      - name: Nichts Halbfertiges ausliefern
        run: |
          set -euo pipefail
          schlecht=0
          for f in dist/index.html dist/sw.js dist/freigabe.html \
                   dist/objekt.html dist/sonnenverlauf.html dist/_redirects; do
            [ -s "$f" ] || { echo "::error::$f fehlt oder ist leer"; schlecht=1; }
          done
          # Ein stehengebliebener Platzhalter heisst: die Seite kann sich nicht
          # anmelden. Lieber gar nicht ausliefern als kaputt.
          if grep -rl '__IMMO_[A-Z_]*__' dist/ 2>/dev/null | grep -q .; then
            echo "::error::In dist/ stehen noch Platzhalter:"
            grep -rho '__IMMO_[A-Z_]*__' dist/ | sort -u
            schlecht=1
          fi
          if grep -q 'window.IMMO_SUPABASE_URL = "";' dist/index.html; then
            echo "::error::dist/index.html hat keine Projekt-Adresse."
            schlecht=1
          fi
          # Die Exposé-Schriften gehoeren zur Auslieferung: der Editor zeichnet
          # seine Vorschau damit, und expose-pdf-erzeugen holt eine fehlende
          # Schrift von hier nach. Fehlen sie, bleibt beides ohne Schrift —
          # und zwar still, denn index.html ist davon vollstaendig.
          schnitte=$(ls dist/schriften/expose/*.ttf 2>/dev/null | wc -l)
          if [ "$schnitte" -lt 20 ]; then
            echo "::error::dist/schriften/expose/ fuehrt nur $schnitte Schnitte (20 erwartet). Erst 'python3 scripts/expose-schriften.py' laufen lassen."
            schlecht=1
          fi
          # Und die Lizenztexte: die SIL Open Font License verlangt sie bei
          # jeder Weitergabe, und eine ausgelieferte Schrift ist eine.
          for ofl in archivo cormorantgaramond plusjakartasans; do
            [ -s "dist/schriften/expose/OFL-$ofl.txt" ] \
              || { echo "::error::dist/schriften/expose/OFL-$ofl.txt fehlt"; schlecht=1; }
          done
          exit $schlecht

      - name: Auf Netlify stellen
        id: stellen
        run: |
          set -euo pipefail
          npm install --no-save netlify-cli@17
          # Aus einem eigenen Verzeichnis, damit die netlify.toml des
          # Altbestands nicht mitgelesen wird.
          mkdir -p auslieferung && cp -r dist/. auslieferung/
          cd auslieferung
          # --json, damit die Adresse maschinell weitergegeben werden kann.
          # Das Protokoll der CLI nennt sie auch, aber ein Schritt, der sie
          # aus Menschenschrift herausliest, bricht beim naechsten
          # Fassungswechsel.
          if [ "${{ github.event.inputs.umgebung }}" = "produktion" ]; then
            npx netlify deploy --dir . --site "$NETLIFY_SITE_ID" --prod --json \
              --message "immoOffice.ai ${{ github.sha }}" > ../ausgabe.json
            schluessel=url
          else
            npx netlify deploy --dir . --site "$NETLIFY_SITE_ID" --json \
              --message "Entwurf ${{ github.sha }}" > ../ausgabe.json
            schluessel=deploy_url
          fi
          cd ..
          ziel=$(python3 -c "import json,sys; print(json.load(open('ausgabe.json'))['$schluessel'])")
          echo "ziel=$ziel" >> "$GITHUB_OUTPUT"
          echo "Ausgeliefert nach $ziel"
          {
            echo "### Oberflaeche ausgeliefert"
            echo ""
            echo "Umgebung: **${{ github.event.inputs.umgebung }}**"
            echo ""
            echo "$ziel"
          } >> "$GITHUB_STEP_SUMMARY"

      # Nachsehen, ob wirklich da ist, was da sein soll. Der Runner kann das
      # und die Arbeitsumgebung nicht: deren Netzfilter laesst Netlify nicht
      # durch. Geprueft wird die Seite selbst und zwei Schriftschnitte —
      # fehlen die, bleibt die Exposé-Vorschau ohne Schrift, und das sieht
      # man an der Seite nicht.
      - name: Nachsehen, was angekommen ist
        run: |
          set -uo pipefail
          ziel="${{ steps.stellen.outputs.ziel }}"
          schlecht=0
          for pfad in "/" "/schriften/expose/Jak-Regular.ttf" \
                      "/schriften/expose/Arch-CondXB.ttf" \
                      "/schriften/expose/OFL-archivo.txt" "/freigabe.html"; do
            antwort=$(curl -s -o /dev/null --max-time 30 \
                      -w '%{http_code} %{size_download}' "$ziel$pfad" || echo "000 0")
            code=${antwort%% *}
            echo "$antwort  $pfad"
            [ "$code" = "200" ] || { echo "::error::$ziel$pfad antwortet mit $code"; schlecht=1; }
          done
          exit $schlecht
