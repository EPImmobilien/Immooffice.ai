<script>
// Der Briefkopf kommt aus den Stammdaten DES MANDANTEN, nicht aus dem
// Quelltext: diese Seite bedient jeden Makler der Plattform. Die Vorlage
// hatte hier ihren eigenen Namen in Versalien stehen; die Neutralisierung
// hat daraus den des Demo-Mandanten gemacht, und der ist bei jedem anderen
// falsch - auf einer Seite, die der Kunde des Maklers liest.
// Bis die Daten da sind, bleibt das Band AUS. Ein leeres blaues Band waere
// schlechter als keines, und ein Beispielname waere falsch.
function kopfSetzen(f){
  var k=document.getElementById("kopf"),n=document.getElementById("kopfname");
  var t=(f&&(f.marken_name||f.firma_name))||"";
  if(n)n.textContent=t;
  if(k)k.style.display=t?"":"none";
  if(t&&document.title.indexOf(t)<0)document.title=document.title+" – "+t;
}
// Impressum, Datenschutz und AGB des Mandanten (fork_32). Was nicht
// hinterlegt ist, wird weggelassen - ein Pflichtlink, der ins Nichts
// fuehrt, ist schlechter als keiner.
function rechtLinks(f){
  var raus=[];
  [[f&&f.url_impressum,"Impressum"],[f&&f.url_datenschutz,"Datenschutz"],[f&&f.url_agb,"AGB"]]
    .forEach(function(p){ if(p[0]) raus.push('<a href="'+esc(p[0])+'">'+p[1]+'</a>'); });
  return raus.length?" · "+raus.join(" · "):"";
}
</script>

// Häufige Fragen (v9): Standardfragen je Objekt, von der KI aus Eckdaten, Exposé und freigegebenen Unterlagen
// beantwortet, dazu die vom Team gepflegten FAQ – nach Kategorie gruppiert, Antworten aufklappbar. Ab 8 Fragen
// zunächst eingeklappt („Alle Fragen anzeigen“), damit die Kachel nicht endlos wird.
function faqHtml(faq){if(!faq.length)return '<div class="faqliste" id="faq"></div>';
  const REIHE=["Kosten","Rechtliches","Zustand & Technik","Nutzung & Verfügbarkeit","Lage","Ablauf"];
  const gruppen=new Map();for(const q of faq){const k=q.kategorie||"Allgemein";if(!gruppen.has(k))gruppen.set(k,[]);gruppen.get(k).push(q);}
  const kats=[...gruppen.keys()].sort((a,b)=>{const ia=REIHE.indexOf(a),ib=REIHE.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib)||a.localeCompare(b);});
  let n=0,versteckt=0,h='<div class="faqliste" id="faq"><div class="muted" style="margin-bottom:2px">Häufige Fragen zu diesem Objekt – Antworten aus Exposé, Eckdaten und freigegebenen Unterlagen'+(faq.some(q=>q.quelle==="ki")?', automatisch zusammengestellt'+(faq.some(q=>q.geprueft)?' und vom Team geprüft':'')+'. Verbindlich sind die Angaben in den Unterlagen.':'.')+'</div>';
  for(const k of kats){const zeilen=gruppen.get(k);const hid=n>=8;if(hid)versteckt+=zeilen.length;
    h+='<div class="faqkat"'+(hid?' hidden':'')+'>'+esc(k)+'</div>';
    for(const q of zeilen){n++;const q2=n>8;if(q2&&!hid)versteckt++;
      const quellen=Array.isArray(q.quellen)&&q.quellen.length?'Quelle: '+q.quellen.map(esc).join(", "):'';
      const herkunft=q.quelle==="ki"?(q.geprueft?'Automatisch erstellt, vom Team geprüft':'Automatisch aus den Objektunterlagen erstellt'):'';
      h+='<details'+((hid||q2)?' hidden':'')+'><summary>'+esc(q.frage)+'</summary><div class="faqa">'+esc(q.antwort)+((quellen||herkunft)?'<small>'+[herkunft,quellen].filter(Boolean).join(' · ')+'</small>':'')+'</div></details>';}}
  if(versteckt>0)h+='<button type="button" class="faqmehr" id="faqMehr">Alle '+n+' Fragen anzeigen</button>';
  return h+'</div>';}
// Sonnenverlauf: Werkzeug-Datei laden, Objektlage einsetzen und über eine Blob-Adresse einbetten (wie im Portal).
// Nicht als srcdoc: dort heißt das Dokument „about:srcdoc“ und MapLibre bekommt seinen Web Worker nicht ans Laufen –
// Stil, Bedienelemente und Quellenangabe erscheinen, aber keine Kachel wird je fertig, die Karte bleibt still leer
// (so gesehen am 20.09.2026). Die Blob-Adresse erbt den Ursprung der Seite, damit läuft der Worker.
// Rückfälle: srcdoc (sehr alte WebViews ohne createObjectURL), zuletzt die normale URL mit Parametern.
// Adresse für die Geokodierung im Sonnenverlauf: Ortsteil-Zusätze („Mühl Rosin OT Kirch Rosin“) kennt die
// Adresssuche (Nominatim) nicht – sie liefert dann „nicht gefunden“. Deshalb nur Straße, Hausnummer, PLZ und Hauptort.
function svAdresse(im){const ort=String(im.ort||"").replace(/\s+(OT|Ortsteil)\s+.*$/i,"").replace(/\s*[\/,(].*$/,"").trim();
  return [im.strasse?(im.strasse+" "+(im.hausnummer||"")).trim():"",[im.plz,ort].filter(Boolean).join(" ")].filter(Boolean).join(", ");}
async function sonneEinbetten(){const f=document.getElementById("sonneRahmen");if(!f)return;
  const konfig={lat:Number(f.dataset.lat),lng:Number(f.dataset.lng),adresse:f.dataset.adresse||""};
  try{const r=await fetch("sonnenverlauf.html",{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);let s=await r.text();
    if(!/Sonnenverlauf/.test(s)||/<title>ImmoOffice<\/title>/.test(s))throw new Error("falsche Datei");
    const inj='<script>window.SV_KONFIG='+JSON.stringify(konfig).replace(/</g,"\\u003c")+';<\/script>';
    s=/<head[^>]*>/i.test(s)?s.replace(/<head[^>]*>/i,m=>m+inj):inj+s;
    let blobUrl=null;try{blobUrl=URL.createObjectURL(new Blob([s],{type:"text/html"}));}catch(e){blobUrl=null;}
    if(blobUrl){if(f.dataset.blob){try{URL.revokeObjectURL(f.dataset.blob);}catch(e){}}f.dataset.blob=blobUrl;f.removeAttribute("srcdoc");f.src=blobUrl;}
    else f.srcdoc=s;}
  catch(e){f.src="sonnenverlauf.html?"+new URLSearchParams({lat:String(konfig.lat),lng:String(konfig.lng),adresse:konfig.adresse}).toString();}}

  if(pdfSeitenweise()){v.classList.add("seitenweise");pdfSeitenRendern(x.url);}
  else{v.classList.remove("seitenweise");document.getElementById("pdfRahmen").src=x.url+"#toolbar=0&navpanes=0";}}
function pdfZu(){const v=document.getElementById("pdfv");v.classList.remove("offen");v.classList.remove("seitenweise");document.getElementById("pdfRahmen").src="about:blank";document.getElementById("pdfSeiten").innerHTML="";pdfLauf++;document.body.style.overflow="";}
// Handy und Tablet zeigen PDFs im Rahmen nur als erste Seite ohne Blättern (Safari) – dort seitenweise mit pdf.js
// rendern (gleiche Bibliothek wie im Portal). Schlägt das Laden fehl, bleibt der normale Rahmen.
function pdfSeitenweise(){return /iPhone|iPad|iPod|Android/i.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Macintosh/.test(navigator.userAgent))||window.matchMedia("(pointer:coarse)").matches;}
let pdfLauf=0,pdfLib=null;
function pdfBibliothek(){if(pdfLib)return pdfLib;pdfLib=new Promise((ok,nein)=>{if(window.pdfjsLib)return ok(window.pdfjsLib);const sc=document.createElement("script");sc.src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js";sc.onload=()=>{if(!window.pdfjsLib)return nein(new Error("pdf.js fehlt"));window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";ok(window.pdfjsLib);};sc.onerror=()=>nein(new Error("pdf.js nicht ladbar"));document.head.appendChild(sc);}).catch(e=>{pdfLib=null;throw e;});return pdfLib;}
async function pdfSeitenRendern(url){const lauf=++pdfLauf;const box=document.getElementById("pdfSeiten");box.innerHTML='<div class="lade">Dokument wird geladen …</div>';
  try{const lib=await pdfBibliothek();const doc=await lib.getDocument({url,withCredentials:false}).promise;if(lauf!==pdfLauf)return;box.innerHTML="";
    const breite=Math.min(box.clientWidth-16,1000)*(window.devicePixelRatio||1);
    for(let n=1;n<=doc.numPages;n++){if(lauf!==pdfLauf)return;const seite=await doc.getPage(n);const vp0=seite.getViewport({scale:1});const skala=breite/vp0.width;const vp=seite.getViewport({scale:skala});
      const c=document.createElement("canvas");c.width=Math.floor(vp.width);c.height=Math.floor(vp.height);c.style.maxWidth=Math.floor(vp.width/(window.devicePixelRatio||1))+"px";box.appendChild(c);
      await seite.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;}
    if(!doc.numPages)throw new Error("leer");}
  catch(e){if(lauf!==pdfLauf)return;const v=document.getElementById("pdfv");v.classList.remove("seitenweise");document.getElementById("pdfRahmen").src=url+"#toolbar=0&navpanes=0";}}
// Galerie (Hauptbild + Vorschauleiste)
let galIdx=0;
function galZeig(i){if(!FOTOS.length)return;galIdx=(i+FOTOS.length)%FOTOS.length;const x=FOTOS[galIdx];const b=document.getElementById("galBild");if(!b)return;b.src=x.url;document.getElementById("galCap").textContent=x.titel||"";document.getElementById("galNr").textContent=(galIdx+1)+" / "+FOTOS.length;
  document.querySelectorAll("#thumbs img").forEach((t,j)=>{t.classList.toggle("an",j===galIdx);if(j===galIdx)t.scrollIntoView({block:"nearest",inline:"center",behavior:"smooth"});});}
function galWeiter(d){galZeig(galIdx+d);}
(function(){let x0=null;document.addEventListener("touchstart",e=>{if(e.target.closest&&e.target.closest("#galHaupt"))x0=e.touches[0].clientX;},{passive:true});document.addEventListener("touchend",e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>40)galWeiter(dx<0?1:-1);});})();
// Lightbox
function lbAuf(i){lbIdx=i;lbZeig();document.getElementById("lb").classList.add("offen");}
function lbZu(){document.getElementById("lb").classList.remove("offen");galZeig(lbIdx);}
function lbWeiter(d){if(!FOTOS.length)return;lbIdx=(lbIdx+d+FOTOS.length)%FOTOS.length;lbZeig();}
function lbZeig(){const x=FOTOS[lbIdx];if(!x)return;document.getElementById("lbimg").src=x.url;document.getElementById("lbc").textContent=(lbIdx+1)+" / "+FOTOS.length+(x.titel?" · "+x.titel:"");}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&document.getElementById("pdfv").classList.contains("offen"))return pdfZu();if(!document.getElementById("lb").classList.contains("offen"))return;if(e.key==="Escape")lbZu();if(e.key==="ArrowRight")lbWeiter(1);if(e.key==="ArrowLeft")lbWeiter(-1);});
laden();
</script>
</body></html>
