<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exposé-Freigabe</title><meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Montserrat,Arial,sans-serif;background:#f3f4f8;color:#1a1a1a;font-size:15px;line-height:1.55}
.kopf{background:#263159;color:#fff;padding:22px 20px;text-align:center}.kopf .n{font-weight:700;letter-spacing:.04em;font-size:18px}.kopf .n span{color:#D4A567}.kopf .u{color:#D4A567;font-size:10px;letter-spacing:.35em;margin-top:2px}
.box{max-width:760px;margin:24px auto;background:#fff;border:1px solid #dfe2ea;padding:26px 28px}
@media(max-width:640px){.box{margin:0;border:none;padding:18px 16px}}
h1{font-size:22px;color:#263159;margin:0 0 6px}h2{font-size:15px;color:#263159;margin:22px 0 8px;text-transform:uppercase;letter-spacing:.06em}
.obj{display:flex;gap:16px;align-items:flex-start;border:1px solid #dfe2ea;padding:14px;margin:14px 0 6px;background:#fafbfd}.obj img{width:150px;height:105px;object-fit:cover;flex-shrink:0}.obj .t{font-weight:700;color:#263159}.obj .a{color:#6b7280;font-size:13px}.obj .fk{margin-top:6px;font-size:13px}
@media(max-width:480px){.obj{flex-direction:column}.obj img{width:100%;height:160px}}
.muted{color:#6b7280;font-size:13px}
.pro{background:#fff7d6;border-left:4px solid #D4A567;padding:12px 14px;margin:8px 0 4px;font-size:14px}
.wichtig{background:#263159;color:#fff;padding:14px 16px;margin:10px 0 4px;font-size:15px;font-weight:700;line-height:1.5}.wichtig span{color:#D4A567}
.dlbox{text-align:center;margin:14px 0}.btn.gross{font-size:17px;padding:16px 30px}
.txt{border:1px solid #dfe2ea;background:#fafbfd;padding:12px 14px;font-size:12.5px;white-space:pre-wrap;max-height:230px;overflow:auto;color:#374151}
label.f{display:block;margin:8px 0;font-size:13px;color:#374151}label.f input{display:block;width:100%;margin-top:4px;padding:10px 12px;border:1px solid #c9cdd8;font:inherit;font-size:15px;background:#fff}
label.h{display:flex;gap:10px;align-items:flex-start;margin:12px 0;font-size:14px;cursor:pointer}label.h input{margin-top:3px;width:18px;height:18px;flex-shrink:0}
.btn{display:inline-block;background:#D4A567;color:#fff;border:none;padding:14px 26px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;text-decoration:none;margin-top:8px}.btn[disabled]{opacity:.45;cursor:not-allowed}
.ok{background:#e6f4ea;border-left:4px solid #1e7e34;padding:14px;margin:12px 0}.err{background:#fde6e6;border-left:4px solid #c83c3c;padding:12px;margin:12px 0}
.fuss{max-width:760px;margin:0 auto 30px;padding:0 20px;font-size:11.5px;color:#6b7280;text-align:center}a{color:#263159}
.mitmarke{margin-top:8px;font-size:10.5px;color:#9aa1ab;letter-spacing:.06em}
</style></head><body>
<div class="kopf" id="kopf" style="display:none"><div class="n" id="kopfname"></div></div>
<script>
// Der Briefkopf kommt aus den Stammdaten DES MANDANTEN, nicht aus dem
// Quelltext: diese Seite bedient jeden Makler der Plattform. Die Vorlage
// hatte hier ihren eigenen Namen in Versalien stehen; die Neutralisierung
// hat daraus den des Demo-Mandanten gemacht, und der ist bei jedem anderen
// falsch - auf einer Seite, die der Kunde des Maklers liest.
// Bis die Daten da sind, bleibt das Band AUS. Ein leeres blaues Band waere
// schlechter als keines, und ein Beispielname waere falsch.
function kopfSetzen(f){
  var k=document.getElementById("kopf"),n=document.getElementById("kopfname");
  var t=(f&&(f.marken_name||f.firma_name))||"";
  if(n)n.textContent=t;
  if(k)k.style.display=t?"":"none";
  if(t&&document.title.indexOf(t)<0)document.title=document.title+" – "+t;
}
// Impressum, Datenschutz und AGB des Mandanten (fork_32). Was nicht
// hinterlegt ist, wird weggelassen - ein Pflichtlink, der ins Nichts
// fuehrt, ist schlechter als keiner.
function rechtLinks(f){
  var raus=[];
  [[f&&f.url_impressum,"Impressum"],[f&&f.url_datenschutz,"Datenschutz"],[f&&f.url_agb,"AGB"]]
    .forEach(function(p){ if(p[0]) raus.push('<a href="'+esc(p[0])+'">'+p[1]+'</a>'); });
  return raus.length?" · "+raus.join(" · "):"";
}
</script>
<div class="box" id="box"><div class="muted">Lädt …</div></div>
<div class="fuss" id="fuss"></div>
<div class="fuss mitmarke">erstellt mit immoOffice.ai</div>
<script>
const API="__IMMO_SUPABASE_URL__/functions/v1/expose-freigabe";
const PARAMS=new URLSearchParams(location.search);
const T=window.IMMO_TOKEN||PARAMS.get("t")||PARAMS.get("expose")||"";
// Direktweg aus dem Newsletter: ?objekt=<Immobilie>&nl=<Newsletter-Kennung>&k=<Kampagne> – Freigabe entsteht erst bei der Bestätigung
const OBJEKT=PARAMS.get("objekt")||"", NL=PARAMS.get("nl")||"", KAMP=PARAMS.get("k")||"";
const box=document.getElementById("box"),fuss=document.getElementById("fuss");
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const eur=n=>n==null||n===""?"":new Intl.NumberFormat("de-DE",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(Number(n));
const dt=s=>new Date(s).toLocaleString("de-DE",{timeZone:"Europe/Berlin"});
const dlListe=(ds)=>{let h='<div class="dlbox" style="text-align:left">';(ds||[]).forEach((d,i)=>{h+=i?'<a class="btn" style="background:#263159;margin:6px 6px 0 0;font-size:14px;padding:11px 18px" href="'+esc(d.url)+'" target="_blank" rel="noopener">⬇ '+esc(d.typ+": "+d.name)+'</a>':'<a class="btn gross" style="margin:0 6px 4px 0" href="'+esc(d.url)+'" target="_blank" rel="noopener">⬇ Exposé herunterladen (PDF)</a>';});return h+'<div class="muted" style="margin-top:8px">Die Download-Links sind 7 Tage gültig – über Ihren persönlichen Link können Sie die Unterlagen jederzeit erneut laden.</div></div>';};
async function api(body){const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});return r.json();}
function fehlerSeite(m,art){
  if(art==="objekt"){box.innerHTML='<h1>Sofortiger Download nicht möglich</h1><div class="err">'+esc(m||"Für dieses Objekt ist der sofortige Exposé-Download derzeit nicht möglich.")+'</div><div class="muted">Wir senden Ihnen das Exposé gern persönlich zu – wenden Sie sich bitte an Ihren Ansprechpartner.</div>';return;}
  if(art==="ungueltig"||!art&&!m){box.innerHTML='<h1>Link ungültig</h1><div class="err">'+esc(m||"Dieser Exposé-Link ist nicht (mehr) gültig.")+' Bitte wenden Sie sich an Ihren Ansprechpartner – wir senden Ihnen gern einen neuen Link.</div>';return;}
  box.innerHTML='<h1>Seite konnte nicht geladen werden</h1><div class="err">Ihr Link ist in Ordnung, aber die Verbindung zu unserem Server ist gerade fehlgeschlagen'+(m?' ('+esc(m)+')':'')+'. Bitte versuchen Sie es gleich noch einmal.</div><div class="dlbox"><button class="btn" onclick="location.reload()">Erneut versuchen</button></div><div class="muted">Klappt es weiterhin nicht, wenden Sie sich bitte an Ihren Ansprechpartner.</div>';
}
function render(d){
  const {im,firma,makler,texte}=d;
  const objektModus=!!d.objekt;
  const f=objektModus?{name:(d.vorbelegt&&d.vorbelegt.name)||"",email:(d.vorbelegt&&d.vorbelegt.email)||"",provisionsmodell:d.provisionsmodell,provision_text:d.provision_text,gueltig_bis:"2999-01-01T00:00:00Z",bestaetigt_am:null}:d.f;
  const titel=im?.objekttitel||im?.bezeichnung||"Immobilie";
  const adresse=im?.adresse_freigeben!==false?[im?.strasse&&(im.strasse+" "+(im.hausnummer||"")).trim(),[im?.plz,im?.ort].filter(Boolean).join(" ")].filter(Boolean).join(", "):[im?.plz,im?.ort].filter(Boolean).join(" ");
  const istMiete=/miet/i.test(String(im?.vertragsart||""));
  const preis=istMiete?(im?.kaltmiete?eur(im.kaltmiete)+" Kaltmiete":""):(im?.angebotspreis?eur(im.angebotspreis)+" Kaufpreis":"");
  const fakten=[preis,im?.wohnflaeche?Number(im.wohnflaeche).toLocaleString("de-DE")+" m² Wohnfläche":"",im?.zimmer?Number(im.zimmer).toLocaleString("de-DE")+" Zimmer":""].filter(Boolean);
  const bestaetigt=!!f.bestaetigt_am, abgelaufen=new Date(f.gueltig_bis)<new Date()&&!bestaetigt, braucht=f.provisionsmodell==="kaeufer";
  const unterl=Number(d.unterlagen_anzahl||0);
  let h=objektModus?'<h1>Exposé anfordern</h1><div class="muted">'+esc(f.name?"Guten Tag "+f.name+", ":"")+'prüfen Sie bitte Ihre Angaben und bestätigen Sie die folgenden Punkte – anschließend erhalten Sie das Exposé sofort zum Download'+(makler?.name?'. Ihr Ansprechpartner: '+esc(makler.name)+(makler.telefon?", "+esc(makler.telefon):""):"")+'.</div>'
    :'<h1>Ihr Exposé zur Immobilie</h1><div class="muted">'+esc(f.name?"Guten Tag "+f.name+", ":"")+'vielen Dank für Ihr Interesse'+(makler?.name?' – Ihr Ansprechpartner: '+esc(makler.name)+(makler.telefon?", "+esc(makler.telefon):""):"")+'.</div>';
  h+='<div class="obj">'+(im?.hauptbild_url?'<img src="'+esc(im.hauptbild_url)+'" alt="">':"")+'<div><div class="t">'+esc(titel)+'</div><div class="a">'+esc(adresse)+(im?.immo_nr?' · Objekt-Nr. '+esc(im.immo_nr):"")+'</div><div class="fk">'+esc(fakten.join(" · "))+'</div>'+(unterl?'<div class="fk" style="color:#263159;font-weight:600">📎 Exposé + '+unterl+' weitere Unterlage'+(unterl>1?'n':'')+' (z. B. Grundriss, Energieausweis) zum Download</div>':'')+'</div></div>';
  if(abgelaufen){h+='<div class="err">Dieser Link ist abgelaufen. Bitte wenden Sie sich an '+esc(makler?.email||firma.email)+'.</div>';}
  else if(bestaetigt){h+='<div class="ok"><strong>Vielen Dank – Ihre Bestätigung liegt uns vor</strong> ('+dt(f.bestaetigt_am)+' Uhr).<br>Sie können das Exposé hier jederzeit erneut herunterladen.</div><div class="dlbox"><button class="btn gross" id="dl">⬇ Exposé & Unterlagen anzeigen</button></div><div id="dlziel"></div><div id="fehler"></div>';}
  else{
    h+='<h2>Provision</h2><div class="pro">'+esc(f.provision_text)+'</div>';
    h+=braucht?'<div class="wichtig"><span>WICHTIG:</span> Eine Provision fällt ausschließlich dann an, wenn Sie diese Immobilie tatsächlich kaufen – also erst mit Abschluss des notariellen Kaufvertrags. Das Anfordern des Exposés, Besichtigungen und unsere Beratung sind für Sie kostenfrei. Entscheiden Sie sich gegen den Kauf, entstehen Ihnen keinerlei Kosten.</div><div class="muted">Rechtsgrundlage: §§ 652 ff. BGB. Bei Wohnungen und Einfamilienhäusern gilt § 656c BGB (Teilung der Provision zwischen Käufer und Verkäufer).</div>':'<div class="wichtig"><span>WICHTIG:</span> Für Sie entstehen durch die Anforderung des Exposés, Besichtigungen und unsere Beratung keinerlei Kosten.</div>';
    h+='<h2>Widerrufsbelehrung</h2><div class="txt">'+esc(texte.widerrufsbelehrung)+'</div>';
    h+=objektModus?'<h2>Ihre Angaben</h2><form id="frm" onsubmit="return false"><label class="f">Name<input type="text" name="name" autocomplete="name" value="'+esc(f.name)+'"></label><label class="f">E-Mail-Adresse *<input type="email" name="email" required autocomplete="email" value="'+esc(f.email)+'"></label><h2>Ihre Bestätigung</h2>':'<h2>Ihre Bestätigung</h2><form id="frm" onsubmit="return false">';
    h+='<label class="h"><input type="checkbox" name="agb" required> Ich habe die <a href="'+esc(texte.agb_url)+'" target="_blank" rel="noopener">Allgemeinen Geschäftsbedingungen</a> von '+esc(firma.firma_name)+' gelesen und akzeptiere sie.</label>';
    h+='<label class="h"><input type="checkbox" name="datenschutz" required> Ich habe die <a href="'+esc(texte.datenschutz_url)+'" target="_blank" rel="noopener">Datenschutzerklärung</a> zur Kenntnis genommen.</label>';
    h+='<label class="h"><input type="checkbox" name="widerruf" required> Ich habe die Widerrufsbelehrung gelesen und zur Kenntnis genommen.</label>';
    h+='<label class="h"><input type="checkbox" name="beginn" required> '+esc(texte.beginn_text)+'</label>';
    h+=braucht?'<label class="h"><input type="checkbox" name="provision" required> Ich habe die oben genannte Provisionsvereinbarung gelesen und akzeptiere sie. Ich erhalte das Exposé für diese Immobilie auf Grundlage dieser Vereinbarung.</label>':'<label class="h"><input type="checkbox" name="provision" required> Ich habe den Hinweis zur Provision zur Kenntnis genommen.</label>';
    h+='<label class="h"><input type="checkbox" name="newsletter"> Ja, informieren Sie mich gelegentlich per E-Mail über weitere passende Immobilienangebote (jederzeit widerrufbar).</label>';
    h+='<div class="muted" style="margin:8px 0 4px">Ihre Bestätigung wird mit Datum, Uhrzeit und IP-Adresse protokolliert. Eine Kopie der Belehrung und der Vereinbarung senden wir Ihnen an '+(objektModus?'die oben angegebene E-Mail-Adresse':'<strong>'+esc(f.email)+'</strong>')+'.</div>';
    const knopf=braucht?'Makler provisionspflichtig beauftragen':'Makler beauftragen (für Sie provisionsfrei)';
    h+='<div class="muted" style="margin:10px 0 2px">Mit Klick auf den folgenden Button beauftragen Sie '+esc(firma.firma_name)+' als Makler'+(braucht?' – provisionspflichtig ausschließlich im Fall des notariellen Kaufs':' – für Sie kostenfrei')+' – und erhalten sofort das Exposé.</div>';
    h+='<button class="btn gross" id="go" disabled>'+knopf+'</button><div id="fehler"></div></form>';
  }
  box.innerHTML=h;
  kopfSetzen(firma);
  fuss.innerHTML=esc(firma.firma_name)+' · '+esc(firma.strasse)+' · '+esc(firma.plz)+' '+esc(firma.ort)+(firma.geschaeftsfuehrer?' · Geschäftsführer: '+esc(firma.geschaeftsfuehrer):"")+(firma.hrb?' · '+esc(firma.registergericht||"")+' '+esc(firma.hrb):"")+(firma.ust_id?' · USt-IdNr. '+esc(firma.ust_id):"")+'<br>'+esc(firma.email)+(firma.web?' · '+esc(firma.web):"");
  const fe=document.getElementById("fehler");const zeig=m=>{fe.innerHTML='<div class="err">'+esc(m)+'</div>';};
  const frm=document.getElementById("frm"),go=document.getElementById("go");
  if(frm){const req=[...frm.querySelectorAll("input[required]")];const chk=()=>{go.disabled=!req.every(i=>i.type==="checkbox"?i.checked:(i.type==="email"?/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(i.value.trim()):i.value.trim().length>0))};req.forEach(i=>{i.addEventListener("change",chk);i.addEventListener("input",chk);});
    go.addEventListener("click",async()=>{go.disabled=true;go.textContent="Wird gespeichert …";fe.innerHTML="";
      try{const haken={};frm.querySelectorAll("input[type=checkbox]").forEach(i=>haken[i.name]=i.checked);
        const nameEl=frm.querySelector('input[name="name"]'),emailEl=frm.querySelector('input[name="email"]');
        const j=objektModus?await api({aktion:"objekt_bestaetigen",immobilie_id:OBJEKT,nl:NL,kampagne:KAMP,name:nameEl?nameEl.value.trim():"",email:emailEl?emailEl.value.trim():"",haken,newsletter:!!haken.newsletter})
          :await api({token:T,aktion:"bestaetigen",haken,newsletter:!!haken.newsletter});
        if(!j.ok)throw new Error(j.fehler||"Unbekannter Fehler");
        frm.outerHTML='<div class="ok"><strong>Vielen Dank – Ihre Beauftragung ist eingegangen.</strong><br>Eine Bestätigung mit allen Texten'+(objektModus?' und Ihren persönlichen Link zum erneuten Herunterladen':'')+' senden wir Ihnen per E-Mail.</div>'+(j.objektseite?'<div class="dlbox"><a class="btn gross" style="background:#263159" href="'+esc(j.objektseite)+'">Zur Objektseite: Bilder, Eckdaten, Unterlagen, Besichtigung</a></div>':'')+dlListe(j.downloads||[{name:"Exposé.pdf",url:j.download_url,typ:"Exposé"}]);
        window.scrollTo(0,0);
      }catch(e){zeig("Leider hat das nicht geklappt: "+e.message);go.disabled=false;go.textContent=knopf;}});}
  const dl=document.getElementById("dl");if(dl){dl.addEventListener("click",async()=>{dl.disabled=true;try{const j=await api({token:T,aktion:"download"});if(!j.ok)throw new Error(j.fehler||"Fehler");document.getElementById("dlziel").innerHTML=dlListe(j.downloads||[{name:"Exposé.pdf",url:j.download_url,typ:"Exposé"}]);dl.style.display="none";}catch(e){zeig(e.message);}dl.disabled=false;});}
}
(async()=>{
  if(!T&&OBJEKT){let j=null;try{j=await api({aktion:"objekt_laden",immobilie_id:OBJEKT,nl:NL,kampagne:KAMP});}catch(e){fehlerSeite(e.message,"netz");return;}if(!j||!j.ok){fehlerSeite(j&&j.fehler||"","objekt");return;}try{render(j);}catch(e){fehlerSeite("Anzeigefehler: "+e.message,"netz");}return;}
  if(!T){fehlerSeite("","ungueltig");return;}let j=null;try{j=await api({token:T,aktion:"laden"});}catch(e){fehlerSeite(e.message,"netz");return;}if(!j||!j.ok){fehlerSeite(j&&j.fehler||"","ungueltig");return;}try{render(j);}catch(e){fehlerSeite("Anzeigefehler: "+e.message,"netz");}})();
</script></body></html>
