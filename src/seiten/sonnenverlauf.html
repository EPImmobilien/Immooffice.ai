<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sonnenverlauf 3D – ImmoOffice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Marcellus&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
  /* Einbettung erkennen: im iframe (Portal, iOS-WebView) laeuft die Fassung ohne eigenen Seitenkopf. */
  if (window.self !== window.top) document.documentElement.classList.add("eingebettet");
</script>
<style>
  :root {
    --navy: #1B2A47;
    --navy-dark: #12203B;
    --gold: #B5934F;
    --gold-hell: #C9AE72;
    --ink: #1B2A47;
    --muted: #7A828C;
    --rand: #E6E8EB;
    --bg: #FAFAFA;
    --karte: #FFFFFF;
    --gruen: #1e7e34;
    --rot: #c0392b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
    font-size: 13px; line-height: 1.55; color: var(--ink);
    background: var(--bg); overflow: hidden;
  }
  h1, h2, h3, .serif { font-family: 'Marcellus', 'Times New Roman', serif; font-weight: 400; }
  button, input, select { font: inherit; color: inherit; }

  /* ---- Seitenkopf: nur in der eigenstaendigen Fassung ---- */
  .sv-kopf {
    background: var(--navy-dark); color: #fff;
    padding: 12px 18px; display: flex; align-items: baseline; gap: 12px;
  }
  .sv-kopf .marke { font-family: 'Marcellus', serif; font-size: 17px; letter-spacing: .04em; }
  .sv-kopf .marke span { color: var(--gold); }
  .sv-kopf .unter { font-size: 10px; letter-spacing: .3em; text-transform: uppercase; color: var(--gold); }
  html.eingebettet .sv-kopf { display: none; }

  /* ---- Grundraster: Karte 70 %, Panel rechts ---- */
  #sv-app { display: flex; flex-direction: column; height: 100vh; }
  .sv-buehne { flex: 1 1 auto; display: grid; grid-template-columns: 70% 30%; min-height: 0; }
  .sv-kartenspalte { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: #dfe3ec; }
  .sv-panel {
    border-left: 1px solid var(--rand); background: var(--karte);
    overflow-y: auto; -webkit-overflow-scrolling: touch; min-width: 0;
  }
  /* iPhone / schmale WebView: Panel unter die Karte */
  @media (max-width: 900px) {
    body { overflow: auto; }
    #sv-app { height: auto; min-height: 100vh; }
    .sv-buehne { display: block; }
    .sv-kartenspalte { display: block; }
    .sv-kartenbox { height: 58vh; min-height: 320px; }
    .sv-panel { border-left: none; border-top: 1px solid var(--rand); overflow: visible; }
  }

  /* ---- Steuerleiste ueber der Karte ---- */
  .sv-leiste {
    flex: 0 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    padding: 8px 12px; background: var(--bg); border-bottom: 1px solid var(--rand);
  }
  .sv-leiste .titel {
    font-size: 11px; font-weight: 600; letter-spacing: .08em;
    text-transform: uppercase; color: var(--navy); margin-right: 2px;
  }
  .sv-eingabe {
    padding: 7px 10px; border: 1px solid var(--rand); background: #fff;
    font-size: 12.5px; color: var(--navy); outline: none; border-radius: 2px;
  }
  .sv-eingabe:focus { border-color: var(--gold); }
  #sv-adresse { flex: 1 1 260px; min-width: 180px; }
  .sv-knopf {
    padding: 7px 12px; border: none; background: var(--gold); color: #fff;
    font-size: 12px; font-weight: 600; cursor: pointer; border-radius: 2px;
    transition: opacity .15s ease;
  }
  .sv-knopf:hover { opacity: .88; }
  .sv-knopf[disabled] { opacity: .45; cursor: default; }
  .sv-knopf.hell { background: transparent; color: var(--navy); border: 1px solid var(--rand); }
  .sv-knopf.blau { background: var(--navy); color: #fff; }
  .sv-chip {
    padding: 5px 9px; border: 1px solid var(--rand); background: #fff;
    font-size: 11.5px; color: var(--navy); cursor: pointer; border-radius: 2px;
  }
  .sv-chip:hover { border-color: var(--gold); }
  .sv-chip.aktiv { background: var(--navy); color: #fff; border-color: var(--navy); }

  /* ---- Karte ---- */
  .sv-karte { position: absolute; inset: 0; }
  .sv-kartenbox { position: relative; flex: 1 1 auto; min-height: 0; }
  .sv-karte canvas { outline: none; }
  .sv-kartenhinweis {
    position: absolute; left: 12px; bottom: 12px; z-index: 5;
    background: rgba(27, 42, 71,.9); color: #fff; padding: 8px 12px;
    font-size: 12px; max-width: 72%; border-left: 3px solid var(--gold);
  }
  .sv-kartenhinweis:empty { display: none; }
  .sv-kein-webgl {
    position: absolute; inset: 0; z-index: 6; display: none;
    align-items: center; justify-content: center; text-align: center;
    background: var(--bg); padding: 24px; color: var(--navy);
  }
  html.kein-webgl .sv-kein-webgl { display: flex; }

  /* ---- Zeitleiste unter der Karte ---- */
  .sv-zeit {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 4;
    background: rgba(255,255,255,.94); border-top: 1px solid var(--rand);
    padding: 8px 12px 10px; display: flex; align-items: center; gap: 12px;
  }
  /* Auf dem iPhone bleibt die Zeitleiste am unteren Kartenrand stehen. */
  @media (max-width: 900px) { .sv-zeit { background: #fff; flex-wrap: wrap; } }
  .sv-zeit .uhr {
    font-family: 'Marcellus', serif; font-size: 22px; color: var(--navy);
    min-width: 76px; text-align: center; line-height: 1.1;
  }
  .sv-zeit .uhr small { display: block; font-family: 'Montserrat', sans-serif; font-size: 10px; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; }
  #sv-slider { flex: 1 1 auto; accent-color: var(--gold); }
  .sv-zeit .marken { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--muted); }

  /* ---- Panel ---- */
  .sv-block { padding: 14px 16px; border-bottom: 1px solid var(--rand); }
  .sv-block h2 {
    font-size: 12px; font-family: 'Montserrat', sans-serif; font-weight: 600;
    letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
    margin: 0 0 10px;
  }
  .sv-kennzahlen { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
  .sv-kennzahl .wert { font-family: 'Marcellus', serif; font-size: 19px; color: var(--navy); line-height: 1.2; }
  .sv-kennzahl .bez { font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .sv-voll { grid-column: 1 / -1; }
  .sv-verschattung {
    grid-column: 1 / -1; padding: 9px 11px; background: var(--bg);
    border-left: 3px solid var(--gold); font-size: 12.5px; color: var(--navy);
  }
  .sv-kompass { display: block; margin: 0 auto; max-width: 100%; }
  .sv-ausrichtung { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; align-items: center; }
  .sv-ausrichtung input[type=number] { width: 78px; }
  .sv-text {
    width: 100%; min-height: 132px; padding: 10px 12px; border: 1px solid var(--rand);
    background: var(--bg); font-family: 'Montserrat', sans-serif; font-size: 12.5px;
    line-height: 1.6; color: var(--navy); resize: vertical; border-radius: 2px;
  }
  .sv-status { font-size: 11.5px; color: var(--muted); min-height: 16px; margin-top: 8px; }
  .sv-status.ok { color: var(--gruen); }
  .sv-status.fehler { color: var(--rot); }
  .sv-legende { display: flex; flex-wrap: wrap; gap: 10px; font-size: 11px; color: var(--muted); margin-top: 8px; }
  .sv-legende i { display: inline-block; width: 11px; height: 11px; margin-right: 4px; vertical-align: -1px; }
  .sv-schalter { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--navy); cursor: pointer; white-space: nowrap; }
  .sv-schalter input { accent-color: var(--gold); margin: 0; }
</style>
</head>
<body>
<div id="sv-app"></div>
<script>
/* =====================================================================
   Sonnenverlauf 3D – ImmoOffice
   Eigenstaendige Fassung. Wird im Portal als iframe-srcdoc eingebettet.
   Vanilla JS, kein Framework, kein localStorage/sessionStorage.
   Deutsche Oberflaeche, englische Bezeichner im Code.
   ===================================================================== */
var Sonnenverlauf = (function () {
  "use strict";

  /* ---------------------------------------------------------------
     0. Konstanten
     --------------------------------------------------------------- */
  var CI = {
    navy: "#1B2A47", navyDark: "#12203B", gold: "#B5934F",
    goldHell: "#C9AE72", muted: "#7A828C", rand: "#E6E8EB"
  };
  var RAD = Math.PI / 180;
  var DEG = 180 / Math.PI;
  var TAG_MS = 86400000;
  var ZONE = "Europe/Berlin";
  var STYLE_URL = "https://tiles.openfreemap.org/styles/liberty";
  var HOEHE_FALLBACK = 9;          // Meter, wenn die Kachel keine Hoehe liefert
  var SCHATTEN_MAX = 400;          // Meter, Kappung sehr langer Schatten (flache Sonne)
  var BAHN_RADIUS = 130;           // Meter, Radius der Sonnenbahn um das Objekt
  var SCHRITT_MIN = 10;            // Minuten-Raster fuer Slider und Verschattungsanalyse
  var ZEITRAFFER_MS = 15000;       // Dauer eines Durchlaufs der Zeitraffer-Wiedergabe
  var OSM_MIN_ZOOM = 15;           // darunter waere die Overpass-Abfrage zu gross
  var OSM_PUFFER = 0.15;           // Bildausschnitt um 15 % vergroessert abfragen (weniger Nachladen)

  // Overpass liefert die vollen OSM-Merkmale (Farbe, Material, Nutzung, Geschosse).
  // Zwei Dienste, damit ein Ausfall oder eine Drosselung nicht gleich alles lahmlegt.
  var OVERPASS_DIENSTE = [
    "https://overpass-api.de/api/interpreter",
    "https://overpass.kumi.systems/api/interpreter"
  ];

  // Baumaterial -> Farbe. Zuordnung wie in OpenMapTiles/planetiler, damit die
  // Overpass-Farben und die Farben aus den Vektorkacheln zusammenpassen.
  var MATERIAL_FARBEN = {
    cement_block: "#6a7880", brick: "#bd8161", plaster: "#dadbdb", wood: "#d48741",
    concrete: "#d3c2b0", metal: "#b7b1a6", stone: "#b4a995", mud: "#9d8b75",
    steel: "#b7b1a6", glass: "#5a81a0", traditional: "#bd8161", masonry: "#bd8161",
    tin: "#b7b1a6", timber_framing: "#b3b0a9", sandstone: "#b4a995", clay: "#9d8b75"
  };

  // Nutzung -> Farbe. Eigene, gedeckte Palette: soll wie ein Ort wirken, nicht wie
  // eine Themenkarte. Greift nur, wenn weder Farbe noch Material getaggt sind.
  var TYP_FARBEN = {
    house: "#e3d9c6", detached: "#e3d9c6", semidetached_house: "#e3d9c6",
    bungalow: "#e3d9c6", residential: "#ddd2bd", apartments: "#d8cbb4",
    terrace: "#dbcfba", dormitory: "#d8cbb4",
    farm: "#c9a075", farm_auxiliary: "#c08a5e", barn: "#c08a5e", stable: "#c08a5e",
    garage: "#b9b3a6", garages: "#b9b3a6", carport: "#b9b3a6", shed: "#b9b3a6", hut: "#b9b3a6",
    commercial: "#c9c4cf", retail: "#c9c4cf", office: "#c1c0cb", supermarket: "#c9c4cf",
    industrial: "#b0b4bb", warehouse: "#b0b4bb", manufacture: "#b0b4bb",
    church: "#cbb7a0", chapel: "#cbb7a0", cathedral: "#cbb7a0",
    school: "#d5c9a8", kindergarten: "#d5c9a8", university: "#d5c9a8", college: "#d5c9a8",
    hospital: "#dcd3cc", public: "#cfc9bd", civic: "#cfc9bd", government: "#cfc9bd",
    greenhouse: "#bcd3cf", roof: "#c4bfb4",
    _standard: "#cfcabf"
  };

  var HIMMELSRICHTUNGEN = [
    { kuerzel: "N",  name: "Norden",     grad: 0   },
    { kuerzel: "NO", name: "Nordosten",  grad: 45  },
    { kuerzel: "O",  name: "Osten",      grad: 90  },
    { kuerzel: "SO", name: "Südosten",   grad: 135 },
    { kuerzel: "S",  name: "Süden",      grad: 180 },
    { kuerzel: "SW", name: "Südwesten",  grad: 225 },
    { kuerzel: "W",  name: "Westen",     grad: 270 },
    { kuerzel: "NW", name: "Nordwesten", grad: 315 }
  ];
  var RICHTUNG_16 = ["Norden","Nordnordosten","Nordosten","Ostnordosten","Osten","Ostsüdosten",
                     "Südosten","Südsüdosten","Süden","Südsüdwesten","Südwesten","Westsüdwesten",
                     "Westen","Westnordwesten","Nordwesten","Nordnordwesten"];
  var MONATE = ["Januar","Februar","März","April","Mai","Juni",
                "Juli","August","September","Oktober","November","Dezember"];

  /* ---------------------------------------------------------------
     1. Zeit: Europe/Berlin inklusive Sommerzeit
     Alle Rechnungen laufen intern auf UTC-Date-Objekten; die Oberflaeche
     zeigt und liest ausschliesslich Berliner Ortszeit.
     --------------------------------------------------------------- */

  /** Versatz der Zone Europe/Berlin gegenueber UTC zum gegebenen Zeitpunkt, in Minuten. */
  function zonenVersatzMinuten(datum) {
    var teile = new Intl.DateTimeFormat("en-US", {
      timeZone: ZONE, hour12: false,
      year: "numeric", month: "2-digit", day: "2-digit",
      hour: "2-digit", minute: "2-digit", second: "2-digit"
    }).formatToParts(datum);
    var p = {};
    teile.forEach(function (t) { p[t.type] = t.value; });
    var alsUtc = Date.UTC(+p.year, +p.month - 1, +p.day, (+p.hour) % 24, +p.minute, +p.second);
    return Math.round((alsUtc - datum.getTime()) / 60000);
  }

  /** Berliner Wanduhrzeit -> echter Zeitpunkt (UTC-Date). Zwei Durchlaeufe wegen Zeitumstellung. */
  function ortszeitZuDatum(jahr, monat, tag, stunde, minute) {
    var roh = Date.UTC(jahr, monat - 1, tag, stunde || 0, minute || 0, 0);
    var versatz = zonenVersatzMinuten(new Date(roh));
    versatz = zonenVersatzMinuten(new Date(roh - versatz * 60000));
    return new Date(roh - versatz * 60000);
  }

  /** Zeitpunkt -> "HH:MM" in Berliner Ortszeit. */
  function uhrzeitText(datum) {
    if (!datum || isNaN(datum.getTime())) return "–";
    return new Intl.DateTimeFormat("de-DE", {
      timeZone: ZONE, hour: "2-digit", minute: "2-digit", hour12: false
    }).format(datum);
  }

  /** Zeitpunkt -> Minuten seit Mitternacht Berliner Ortszeit. */
  function minutenSeitMitternacht(datum) {
    var t = uhrzeitText(datum).split(":");
    return (+t[0]) * 60 + (+t[1]);
  }

  /** "YYYY-MM-DD" des heutigen Tages in Berliner Ortszeit (fuer das Datumsfeld). */
  function heuteIso() {
    var teile = new Intl.DateTimeFormat("en-CA", {
      timeZone: ZONE, year: "numeric", month: "2-digit", day: "2-digit"
    }).format(new Date());
    return teile;
  }

  function isoZerlegen(iso) {
    var t = String(iso || "").split("-");
    return { jahr: +t[0], monat: +t[1], tag: +t[2] };
  }

  function datumText(iso) {
    var d = isoZerlegen(iso);
    if (!d.jahr) return "";
    return d.tag + ". " + MONATE[d.monat - 1] + " " + d.jahr;
  }

  function minutenText(minuten) {
    var m = Math.max(0, Math.round(minuten));
    var std = Math.floor(m / 60), rest = m % 60;
    return std + " h " + (rest < 10 ? "0" : "") + rest + " min";
  }

  /* ---------------------------------------------------------------
     2. Sonnenstand (SunCalc-Verfahren, inline implementiert)
     Nach dem astronomischen Standardverfahren (Meeus, low precision),
     wie es auch SunCalc verwendet. Kein externer Dienst.
     --------------------------------------------------------------- */
  var J1970 = 2440588, J2000 = 2451545;
  var SCHIEFE = RAD * 23.4397;   // Schiefe der Ekliptik

  function zuJulian(datum) { return datum.valueOf() / TAG_MS - 0.5 + J1970; }
  function ausJulian(j) { return new Date((j + 0.5 - J1970) * TAG_MS); }
  function tageSeitJ2000(datum) { return zuJulian(datum) - J2000; }

  function rektaszension(l, b) {
    return Math.atan2(Math.sin(l) * Math.cos(SCHIEFE) - Math.tan(b) * Math.sin(SCHIEFE), Math.cos(l));
  }
  function deklination(l, b) {
    return Math.asin(Math.sin(b) * Math.cos(SCHIEFE) + Math.cos(b) * Math.sin(SCHIEFE) * Math.sin(l));
  }
  function azimutRad(H, phi, dec) {
    return Math.atan2(Math.sin(H), Math.cos(H) * Math.sin(phi) - Math.tan(dec) * Math.cos(phi));
  }
  function hoeheRad(H, phi, dec) {
    return Math.asin(Math.sin(phi) * Math.sin(dec) + Math.cos(phi) * Math.cos(dec) * Math.cos(H));
  }
  function sternzeit(d, lw) { return RAD * (280.16 + 360.9856235 * d) - lw; }
  function mittlereAnomalie(d) { return RAD * (357.5291 + 0.98560028 * d); }
  function eklipLaenge(M) {
    var C = RAD * (1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M));
    return M + C + RAD * 102.9372 + Math.PI;
  }
  function sonnenKoordinaten(d) {
    var M = mittlereAnomalie(d), L = eklipLaenge(M);
    return { dec: deklination(L, 0), ra: rektaszension(L, 0), M: M, L: L };
  }

  /**
   * Sonnenstand fuer Zeitpunkt und Ort.
   * @returns {{azimut:number, elevation:number}} Azimut in Grad von Nord im Uhrzeigersinn,
   *          Elevation in Grad ueber dem Horizont.
   */
  function sonnenstand(datum, lat, lng) {
    var lw = RAD * -lng, phi = RAD * lat, d = tageSeitJ2000(datum);
    var c = sonnenKoordinaten(d), H = sternzeit(d, lw) - c.ra;
    // SunCalc misst den Azimut von Sued; hier auf die uebliche Kompassrichtung drehen.
    var az = (azimutRad(H, phi, c.dec) * DEG + 180 + 360) % 360;
    return { azimut: az, elevation: hoeheRad(H, phi, c.dec) * DEG };
  }

  var J0 = 0.0009;
  function julianZyklus(d, lw) { return Math.round(d - J0 - lw / (2 * Math.PI)); }
  function naeherungsTransit(Ht, lw, n) { return J0 + (Ht + lw) / (2 * Math.PI) + n; }
  function transitJulian(ds, M, L) { return J2000 + ds + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * L); }
  function stundenwinkel(h, phi, dec) {
    var w = (Math.sin(h) - Math.sin(phi) * Math.sin(dec)) / (Math.cos(phi) * Math.cos(dec));
    if (w > 1 || w < -1) return null;   // Polartag / Polarnacht
    return Math.acos(w);
  }

  /**
   * Auf- und Untergang, Sonnenhoechststand fuer einen Kalendertag (Berliner Ortszeit).
   * @returns {{aufgang:Date|null, untergang:Date|null, mittag:Date, maxHoehe:number, tageslaenge:number}}
   */
  function tagesZeiten(iso, lat, lng) {
    var t = isoZerlegen(iso);
    // Bezugszeitpunkt: 12:00 Ortszeit des gewaehlten Tages
    var bezug = ortszeitZuDatum(t.jahr, t.monat, t.tag, 12, 0);
    var lw = RAD * -lng, phi = RAD * lat;
    var d = tageSeitJ2000(bezug);
    var n = julianZyklus(d, lw);
    var ds = naeherungsTransit(0, lw, n);
    var M = mittlereAnomalie(ds);
    var L = eklipLaenge(M);
    var dec = deklination(L, 0);
    var jMittag = transitJulian(ds, M, L);
    var mittag = ausJulian(jMittag);

    var h0 = -0.833 * RAD;   // Sonnenoberkante inkl. Refraktion
    var w = stundenwinkel(h0, phi, dec);
    var aufgang = null, untergang = null, tageslaenge;
    if (w === null) {
      // Kein Auf- oder Untergang an diesem Tag (in Deutschland nicht zu erwarten)
      tageslaenge = hoeheRad(0, phi, dec) > 0 ? 1440 : 0;
    } else {
      var jUnter = transitJulian(naeherungsTransit(w, lw, n), M, L);
      untergang = ausJulian(jUnter);
      aufgang = ausJulian(jMittag - (jUnter - jMittag));
      tageslaenge = (untergang.getTime() - aufgang.getTime()) / 60000;
    }
    var maxHoehe = sonnenstand(mittag, lat, lng).elevation;
    return { aufgang: aufgang, untergang: untergang, mittag: mittag, maxHoehe: maxHoehe, tageslaenge: tageslaenge };
  }

  /* ---------------------------------------------------------------
     3. Geodaesie-Helfer (ohne Turf)
     --------------------------------------------------------------- */

  /** Meter je Grad geografischer Breite auf der Breite lat. */
  function meterProGradBreite(lat) {
    var p = lat * RAD;
    return 111132.92 - 559.82 * Math.cos(2 * p) + 1.175 * Math.cos(4 * p) - 0.0023 * Math.cos(6 * p);
  }
  /** Meter je Grad geografischer Laenge auf der Breite lat. */
  function meterProGradLaenge(lat) {
    var p = lat * RAD;
    return 111412.84 * Math.cos(p) - 93.5 * Math.cos(3 * p) + 0.118 * Math.cos(5 * p);
  }

  /** Meterversatz (Ost/Nord) auf einen Punkt addieren. */
  function punktVersetzen(punkt, dxMeter, dyMeter, refLat) {
    return [
      punkt[0] + dxMeter / meterProGradLaenge(refLat),
      punkt[1] + dyMeter / meterProGradBreite(refLat)
    ];
  }

  /** Ganzen Ring um einen Meterversatz verschieben. */
  function ringVersetzen(ring, dxMeter, dyMeter, refLat) {
    var mLng = meterProGradLaenge(refLat), mLat = meterProGradBreite(refLat);
    var dLng = dxMeter / mLng, dLat = dyMeter / mLat;
    var raus = [], i;
    for (i = 0; i < ring.length; i++) raus.push([ring[i][0] + dLng, ring[i][1] + dLat]);
    return raus;
  }

  /** Abstand zweier Punkte in Metern (ebene Naeherung, fuer Stadtmassstab ausreichend). */
  function abstandMeter(a, b) {
    var refLat = (a[1] + b[1]) / 2;
    var dx = (b[0] - a[0]) * meterProGradLaenge(refLat);
    var dy = (b[1] - a[1]) * meterProGradBreite(refLat);
    return Math.sqrt(dx * dx + dy * dy);
  }

  /**
   * Konvexe Huelle (Andrew's monotone chain). Gerechnet wird in lokalen Metern,
   * damit die Verzerrung zwischen Laengen- und Breitengrad die Huelle nicht verfaelscht.
   * @returns {Array} geschlossener Ring in [lng, lat]
   */
  function konvexeHuelle(punkte, refLat) {
    if (!punkte || punkte.length < 3) return null;
    var mLng = meterProGradLaenge(refLat), mLat = meterProGradBreite(refLat);
    var o = punkte[0];
    var p = punkte.map(function (q) {
      return { x: (q[0] - o[0]) * mLng, y: (q[1] - o[1]) * mLat, roh: q };
    });
    p.sort(function (a, b) { return a.x === b.x ? a.y - b.y : a.x - b.x; });
    var kreuz = function (a, b, c) { return (b.x - a.x) * (c.y - a.y) - (b.y - a.y) * (c.x - a.x); };
    var unten = [], oben = [], i;
    for (i = 0; i < p.length; i++) {
      while (unten.length >= 2 && kreuz(unten[unten.length - 2], unten[unten.length - 1], p[i]) <= 0) unten.pop();
      unten.push(p[i]);
    }
    for (i = p.length - 1; i >= 0; i--) {
      while (oben.length >= 2 && kreuz(oben[oben.length - 2], oben[oben.length - 1], p[i]) <= 0) oben.pop();
      oben.push(p[i]);
    }
    unten.pop(); oben.pop();
    var huelle = unten.concat(oben);
    if (huelle.length < 3) return null;
    var ring = huelle.map(function (q) { return q.roh; });
    ring.push(ring[0]);
    return ring;
  }

  /** Punkt-in-Polygon (Strahlverfahren) auf [lng, lat]. */
  function punktImPolygon(punkt, ring) {
    var x = punkt[0], y = punkt[1], drin = false;
    for (var i = 0, j = ring.length - 1; i < ring.length; j = i++) {
      var xi = ring[i][0], yi = ring[i][1], xj = ring[j][0], yj = ring[j][1];
      if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) drin = !drin;
    }
    return drin;
  }

  /**
   * Schattenpolygon eines Gebaeudes: Grundriss um hoehe/tan(elevation) gegen den
   * Azimut verschoben, konvexe Huelle aus Original und Verschiebung.
   */
  function schattenPolygon(ring, hoehe, azimut, elevation, refLat) {
    if (elevation <= 0.5 || hoehe <= 0) return null;
    var laenge = hoehe / Math.tan(elevation * RAD);
    if (!isFinite(laenge) || laenge <= 0) return null;
    laenge = Math.min(laenge, SCHATTEN_MAX);
    // Schatten faellt der Sonne entgegengesetzt: Azimut + 180 Grad
    var dx = -laenge * Math.sin(azimut * RAD);   // Ost
    var dy = -laenge * Math.cos(azimut * RAD);   // Nord
    var verschoben = ringVersetzen(ring, dx, dy, refLat);
    return konvexeHuelle(ring.concat(verschoben), refLat);
  }

    var g = ((grad % 360) + 360) % 360;
    return RICHTUNG_16[Math.round(g / 22.5) % 16];
  }
  function richtungKurz(grad) {
    var g = ((grad % 360) + 360) % 360;
    var namen = ["N","NNO","NO","ONO","O","OSO","SO","SSO","S","SSW","SW","WSW","W","WNW","NW","NNW"];
    return namen[Math.round(g / 22.5) % 16];
  }

  /** Prueft, ob das Geraet WebGL bereitstellt. */
  function webglVorhanden() {
    if (typeof maplibregl === "undefined") return false;
    try {
      if (typeof maplibregl.supported === "function") return maplibregl.supported();
      var c = document.createElement("canvas");
      return !!(c.getContext("webgl2") || c.getContext("webgl") || c.getContext("experimental-webgl"));
    } catch (e) { return false; }
  }

  /** Erste Symbolebene des Stils – darueber bleiben Beschriftungen lesbar. */
  function ersteSymbolEbene(karte) {
    var ebenen = karte.getStyle().layers || [];
    for (var i = 0; i < ebenen.length; i++) if (ebenen[i].type === "symbol") return ebenen[i].id;
    return undefined;
  }

  /** Vektorquelle finden, die den building-Layer fuehrt (OpenFreeMap/OpenMapTiles). */
  function gebaeudeQuelle(karte) {
    var stil = karte.getStyle(), ebenen = stil.layers || [];
    for (var i = 0; i < ebenen.length; i++) {
      if (ebenen[i]["source-layer"] === "building" && ebenen[i].source) return ebenen[i].source;
    }
    if (stil.sources && stil.sources.openmaptiles) return "openmaptiles";
    var namen = Object.keys(stil.sources || {});
    return namen.length ? namen[0] : null;
  }

  var HOEHE_AUSDRUCK = ["to-number", ["coalesce", ["get", "render_height"], ["get", "height"], HOEHE_FALLBACK]];
  var MIN_HOEHE_AUSDRUCK = ["to-number", ["coalesce", ["get", "render_min_height"], ["get", "min_height"], 0]];

  function karteAufbauen() {
    if (!webglVorhanden()) {
      Z.webgl = false;
      document.documentElement.classList.add("kein-webgl");
      return;
    }
    var karte;
    try {
      karte = new maplibregl.Map({
        container: E.karte,
        style: STYLE_URL,
        center: [Z.lng, Z.lat],
        zoom: 17, pitch: 60, bearing: 0,
        antialias: true,
        preserveDrawingBuffer: true,     // notwendig fuer den PNG-Export
        attributionControl: { compact: true }
      });
    } catch (e) {
      Z.webgl = false;
      document.documentElement.classList.add("kein-webgl");
      return;
    }
    Z.karte = karte;
    karte.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), "top-right");
    karte.dragRotate.enable();
    karte.touchZoomRotate.enableRotation();

      var m = ev && ev.error && ev.error.message ? ev.error.message : "";
      kartenhinweis("Kartenkacheln konnten nicht geladen werden – Sonnenstand, Kompass und Text rechts bleiben gültig." + (m ? " (" + m + ")" : ""));
    });

      Z.quelle = gebaeudeQuelle(karte);
      schichtenAnlegen(karte);
      Z.karteBereit = true;
      markerSetzen();

      });

      karte.on("moveend", function () { gebaeudeSammeln(); schattenPlanen(0); analysePlanen(400); osmPlanen(700); });
      // Erste vollstaendige Auswertung, sobald die Kacheln da sind

    });
  }

  function schichtenAnlegen(karte) {

  function ringMitte(ring) {
    var x = 0, y = 0, n = 0;
    for (var i = 0; i < ring.length - 1; i++) { x += ring[i][0]; y += ring[i][1]; n++; }
    return n ? [x / n, y / n] : ring[0];
  }

  function ringeAusGeometrie(geo) {
    if (!geo) return [];
    if (geo.type === "Polygon") return geo.coordinates.length ? [geo.coordinates[0]] : [];
    if (geo.type === "MultiPolygon") {
      return geo.coordinates.map(function (p) { return p[0]; }).filter(Boolean);
    }
    return [];
  }

  /* ---------------------------------------------------------------
     7a. Echte Gebaeudemerkmale aus OpenStreetMap (Overpass)
     Die Vektorkacheln fuehren nur render_height, render_min_height, colour und
     hide_3d - keine Nutzung, kein Material. Overpass liefert die vollen Merkmale,
     daraus werden Farbe und Hoehe abgeleitet.
     --------------------------------------------------------------- */

  var farbPruefer = null;

  /**
   * Prueft einen OSM-Farbwert gegen den CSS-Farbparser des Browsers.
   * OSM enthaelt viel Unbrauchbares ("hellgrau", "Sandstein"); solche Werte
   * werden verworfen statt die Karte zu verfaerben.
   * @returns {string|null} normalisierte Farbe oder null
   */
  function farbeGueltig(wert) {
    if (!wert) return null;
    var w = String(wert).trim().toLowerCase();
    if (!w || w.length > 32) return null;
    if (!farbPruefer) {
      try { farbPruefer = document.createElement("canvas").getContext("2d"); }
      catch (e) { return /^#[0-9a-f]{3}([0-9a-f]{3})?$/.test(w) ? w : null; }
    }
    // Zwei verschiedene Ausgangsfarben: bleibt danach beides gleich, wurde der Wert verstanden
    farbPruefer.fillStyle = "#000000"; farbPruefer.fillStyle = w;
    var a = farbPruefer.fillStyle;
    farbPruefer.fillStyle = "#ffffff"; farbPruefer.fillStyle = w;
    return a === farbPruefer.fillStyle ? a : null;
  }

  /** Farbe eines Gebaeudes: echte Fassadenfarbe > Baumaterial > Nutzung > Standard. */
  function osmFarbe(t) {
    var f = farbeGueltig(t["building:colour"] || t["building:color"] || t.colour || t.color);
    if (f) return { farbe: f, quelle: "farbe" };
    var material = t["building:material"] || t.material;
    if (material && MATERIAL_FARBEN[material]) return { farbe: MATERIAL_FARBEN[material], quelle: "material" };
    if (t.building && TYP_FARBEN[t.building]) return { farbe: TYP_FARBEN[t.building], quelle: "typ" };
    return { farbe: TYP_FARBEN._standard, quelle: "standard" };
  }

  /** Hoehe: height > building:levels * 3 m + Dachansatz > Fallback. */
  function osmHoehe(t) {
    var h = parseFloat(t.height || t["building:height"]);
    if (isFinite(h) && h > 0) return Math.min(h, 300);
    var geschosse = parseFloat(t["building:levels"] || t.levels);
    if (isFinite(geschosse) && geschosse > 0) return Math.min(geschosse * 3 + 1.5, 300);
    return HOEHE_FALLBACK;
  }
  function osmBasis(t) {
    var b = parseFloat(t.min_height || t["building:min_height"]);
    if (isFinite(b) && b >= 0) return b;
    var g = parseFloat(t["building:min_level"]);
    return isFinite(g) && g > 0 ? g * 3 : 0;
  }

  /** Overpass-Abfrage fuer einen Bereich [sued, west, nord, ost]. */
  function osmAbfrage(bbox) {
    var b = bbox.map(function (x) { return x.toFixed(6); }).join(",");
    return "[out:json][timeout:25];(" +
           "way[\"building\"](" + b + ");" +
           "relation[\"building\"][\"type\"=\"multipolygon\"](" + b + ");" +
           ");out geom;";
  }

  /** Antwort in Ringe mit Merkmalen umsetzen. */
  function osmVerarbeiten(json) {
    var raus = [];
    (json && json.elements || []).forEach(function (e) {
      var ringe = [];
      if (e.type === "way" && e.geometry) {
        ringe.push(e.geometry);
      } else if (e.type === "relation" && e.members) {
        e.members.forEach(function (m) { if (m.role === "outer" && m.geometry) ringe.push(m.geometry); });
      }
      var t = e.tags || {};
      var f = osmFarbe(t), hoehe = osmHoehe(t), basis = osmBasis(t);
      ringe.forEach(function (punkte) {
        if (!punkte || punkte.length < 4) return;
        var ring = punkte.map(function (p) { return [p.lon, p.lat]; });
        var a = ring[0], b = ring[ring.length - 1];
        if (a[0] !== b[0] || a[1] !== b[1]) ring.push([a[0], a[1]]);   // Ring schliessen
        var mitte = ringMitte(ring);
        raus.push({ ring: ring, mitte: mitte, hoehe: hoehe, basis: basis,
                    farbe: f.farbe, quelle: f.quelle, typ: t.building || "" });
      });
    });
    return raus;
  }

  function osmStatus(text) { if (E.osmstatus) E.osmstatus.textContent = text || ""; }

  /** Deckt der zuvor geladene Bereich den neuen vollstaendig ab? */
  function bboxEnthalten(neu, alt) {
    return !!alt && neu[0] >= alt[0] && neu[1] >= alt[1] && neu[2] <= alt[2] && neu[3] <= alt[3];
  }

  /** Abfrage entprellt anstossen (Kartenbewegung erzeugt sonst viele Anfragen). */
  function osmPlanen(verzoegerung) {
    if (Z.osmTimer) clearTimeout(Z.osmTimer);
    Z.osmTimer = setTimeout(function () { Z.osmTimer = null; osmLaden(); },
                            verzoegerung == null ? 700 : verzoegerung);
  }

  function osmLaden() {
    if (!Z.karte || !Z.karteBereit || !Z.osmFarben) return;
    if (Z.karte.getZoom() < OSM_MIN_ZOOM) {
      osmStatus("Für echte Gebäudefarben näher heranzoomen.");
      return;
    }
    var g = Z.karte.getBounds();
    var hoehe = g.getNorth() - g.getSouth(), breite = g.getEast() - g.getWest();
    var bbox = [g.getSouth() - hoehe * OSM_PUFFER, g.getWest() - breite * OSM_PUFFER,
                g.getNorth() + hoehe * OSM_PUFFER, g.getEast() + breite * OSM_PUFFER];
    if (bboxEnthalten([g.getSouth(), g.getWest(), g.getNorth(), g.getEast()], Z.osmBbox)) return;
    osmStatus("Gebäudemerkmale werden aus OpenStreetMap geladen …");
    osmHolen(bbox, 0, ++Z.osmLauf);
  }

  function osmHolen(bbox, dienst, lauf) {
    if (dienst >= OVERPASS_DIENSTE.length) {
      osmStatus("OpenStreetMap-Merkmale gerade nicht abrufbar – die Karte zeigt die neutrale Bebauung.");
      return;
    }
    fetch(OVERPASS_DIENSTE[dienst], {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: "data=" + encodeURIComponent(osmAbfrage(bbox))
    }).
    then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); }).
    then(function (j) {
      if (lauf !== Z.osmLauf) return;            // zwischenzeitlich neu angefragt
      osmUebernehmen(bbox, osmVerarbeiten(j));
    }).
    catch(function () {
      if (lauf !== Z.osmLauf) return;
      osmHolen(bbox, dienst + 1, lauf);          // naechster Dienst
    });
  }

  function osmUebernehmen(bbox, gebaeude) {
    Z.osmGebaeude = gebaeude;
    Z.osmBbox = bbox;
    quelleSetzen("sv-gebaeude-osm", gebaeude.map(function (g) {
      return { type: "Feature",
               properties: { farbe: g.farbe, hoehe: g.hoehe, basis: g.basis },
               geometry: { type: "Polygon", coordinates: [g.ring] } };
    }));
    osmEbenenUmschalten();
    // Zaehlen, woher die Farben tatsaechlich stammen - ehrliche Rueckmeldung
    var z = { farbe: 0, material: 0, typ: 0, standard: 0 };
    gebaeude.forEach(function (g) { z[g.quelle]++; });
    if (!gebaeude.length) {
      osmStatus("Für diesen Ausschnitt liegen in OpenStreetMap keine Gebäude vor.");
    } else {
      osmStatus(gebaeude.length + " Gebäude: " + z.farbe + " mit hinterlegter Fassadenfarbe, " +
                z.material + " nach Baumaterial, " + z.typ + " nach Nutzung, " +
                z.standard + " ohne Angabe.");
    }
    gebaeudeSammeln();
    schattenPlanen(0);
    analysePlanen(200);
  }

  /** Je nach Schalter und Datenlage die eingefaerbte oder die neutrale Ebene zeigen. */
  function osmEbenenUmschalten() {
    if (!Z.karte || !Z.karteBereit) return;
    var farbig = !!(Z.osmFarben && Z.osmGebaeude && Z.osmGebaeude.length);
    if (Z.karte.getLayer("sv-gebaeude-osm")) {
      Z.karte.setLayoutProperty("sv-gebaeude-osm", "visibility", farbig ? "visible" : "none");
    }
    if (Z.karte.getLayer("sv-gebaeude")) {
      Z.karte.setLayoutProperty("sv-gebaeude", "visibility", farbig ? "none" : "visible");
    }
  }

  /** Gebaeude im Sichtbereich aus den gerenderten Kacheln uebernehmen. */
  function gebaeudeSammeln() {
    if (!Z.karte || !Z.karteBereit) { Z.gebaeude = []; return; }

    // Liegen die OSM-Merkmale vor, sind sie die bessere Grundlage: vollstaendiger als
    // das gerade Gerenderte und mit Hoehen aus building:levels statt nur render_height.
    // Bewusst unabhaengig vom Schalter "Echte Farben": der steuert nur die Darstellung,
    // eine einmal geladene Datenlage soll die Schattenanalyse nicht wieder verlieren.
    if (Z.osmGebaeude && Z.osmGebaeude.length) {
      Z.gebaeude = Z.osmGebaeude.map(function (g) {
        return { ring: g.ring, mitte: g.mitte, hoehe: g.hoehe, basis: g.basis,
                 abstand: abstandMeter(g.mitte, [Z.lng, Z.lat]) };
      }).sort(function (a, b) { return a.abstand - b.abstand; }).slice(0, 400);
      kartenhinweis("");
      eigenesGebaeudeSuchen();
      return;
    }

    if (!Z.karte.getLayer("sv-gebaeude")) { Z.gebaeude = []; return; }
    var treffer = [];
    try { treffer = Z.karte.queryRenderedFeatures({ layers: ["sv-gebaeude"] }) || []; }
    catch (e) { treffer = []; }
    var gesehen = {}, liste = [];
    treffer.forEach(function (f) {
      var p = f.properties || {};
      ringeAusGeometrie(f.geometry).forEach(function (ring) {
        if (!ring || ring.length < 4) return;
        var mitte = ringMitte(ring);
        var schluessel = mitte[0].toFixed(6) + "," + mitte[1].toFixed(6);
        if (gesehen[schluessel]) return;
        gesehen[schluessel] = 1;
        var hoehe = Number(p.render_height != null ? p.render_height : p.height);
        if (!isFinite(hoehe) || hoehe <= 0) hoehe = HOEHE_FALLBACK;   // Fallback 9 m
        var basis = Number(p.render_min_height != null ? p.render_min_height : p.min_height);
        if (!isFinite(basis) || basis < 0) basis = 0;
        liste.push({
          ring: ring, mitte: mitte, hoehe: hoehe, basis: basis,
          abstand: abstandMeter(mitte, [Z.lng, Z.lat])
        });
      });
    });
    liste.sort(function (a, b) { return a.abstand - b.abstand; });
    Z.gebaeude = liste.slice(0, 400);
    if (!Z.gebaeude.length) {
      kartenhinweis("Im Ausschnitt liegen keine Gebäudedaten vor – der Schattenwurf lässt sich hier nicht berechnen. Näher heranzoomen oder den Ausschnitt verschieben.");
    } else {
      kartenhinweis("");
    }
    eigenesGebaeudeSuchen();
  }

  /** Gebaeude unter dem Marker heraussuchen und golden einfaerben. */
  function eigenesGebaeudeSuchen() {
    var punkt = [Z.lng, Z.lat], gefunden = null, i;
    for (i = 0; i < Z.gebaeude.length; i++) {
      if (punktImPolygon(punkt, Z.gebaeude[i].ring)) { gefunden = Z.gebaeude[i]; break; }
    }
    // Marker im Garten/auf der Terrasse: naechstes Gebaeude bis 25 m uebernehmen
    if (!gefunden && Z.gebaeude.length && Z.gebaeude[0].abstand <= 25) gefunden = Z.gebaeude[0];
    Z.eigenes = gefunden;
    quelleSetzen("sv-objekt", gefunden ? [{
      type: "Feature",
      properties: { hoehe: gefunden.hoehe, basis: gefunden.basis },
      geometry: { type: "Polygon", coordinates: [gefunden.ring] }
    }] : []);
  }

  /** Schattenpolygone aller sichtbaren Gebaeude fuer den aktuellen Sonnenstand. */
  function schattenZeichnen() {
    if (!Z.karte || !Z.karteBereit) return;
    var stand = Z.stand;
    if (!Z.gebaeude.length || stand.elevation <= 0.5) { quelleSetzen("sv-schatten", []); return; }
    var features = [];
    Z.gebaeude.forEach(function (g) {
      var ring = schattenPolygon(g.ring, g.hoehe, stand.azimut, stand.elevation, g.mitte[1]);
      if (!ring) return;
      features.push({ type: "Feature", properties: {}, geometry: { type: "Polygon", coordinates: [ring] } });
    });
    quelleSetzen("sv-schatten", features);
  }

  /** Neuberechnung der Schatten mit Entprellung (100 ms), damit der Slider fluessig bleibt. */
  function schattenPlanen(verzoegerung) {
    if (Z.schattenTimer) clearTimeout(Z.schattenTimer);
    Z.schattenTimer = setTimeout(function () {
      Z.schattenTimer = null;
      schattenZeichnen();
    }, verzoegerung == null ? 100 : verzoegerung);
  }

  /** Verschattungsanalyse entprellt nachziehen (nach Kartenbewegung). */
  function analysePlanen(verzoegerung) {
    if (Z.analyseTimer) clearTimeout(Z.analyseTimer);
    Z.analyseTimer = setTimeout(function () {
      Z.analyseTimer = null;
      verschattungBerechnen();
      panelAktualisieren();
      textAktualisieren();
    }, verzoegerung == null ? 400 : verzoegerung);
  }

  /* ---------------------------------------------------------------
     8. Sonnenbahn, Sonnenstand und Licht auf der Karte
     --------------------------------------------------------------- */

  /** Elevation -> Abstand vom Objekt: je hoeher die Sonne, desto naeher am Mittelpunkt. */
  function bahnAbstand(elevation) {
    return BAHN_RADIUS * Math.max(0.08, 1 - Math.max(0, elevation) / 90);
  }

  function bahnPunkt(azimut, elevation) {
    var r = bahnAbstand(elevation);
    return punktVersetzen([Z.lng, Z.lat], r * Math.sin(azimut * RAD), r * Math.cos(azimut * RAD), Z.lat);
  }

  function sonnenbahnZeichnen() {
    if (!Z.karte || !Z.karteBereit || !Z.zeiten) return;
    var t = isoZerlegen(Z.datum), punkte = [], m;
    for (m = 0; m <= 1440; m += SCHRITT_MIN) {
      var zeitpunkt = ortszeitZuDatum(t.jahr, t.monat, t.tag, Math.floor(m / 60), m % 60);
      var s = sonnenstand(zeitpunkt, Z.lat, Z.lng);
      if (s.elevation < 0) continue;
      punkte.push(bahnPunkt(s.azimut, s.elevation));
    }
    quelleSetzen("sv-bahn", punkte.length > 1 ? [{
      type: "Feature", properties: {}, geometry: { type: "LineString", coordinates: punkte }
    }] : []);

    // Auf- und Untergangsrichtung als Strahlen
    var strahlen = [];
    [Z.zeiten.aufgang, Z.zeiten.untergang].forEach(function (zp) {
      if (!zp) return;
      var s = sonnenstand(zp, Z.lat, Z.lng);
      var ende = punktVersetzen([Z.lng, Z.lat],
        BAHN_RADIUS * 1.25 * Math.sin(s.azimut * RAD),
        BAHN_RADIUS * 1.25 * Math.cos(s.azimut * RAD), Z.lat);
      strahlen.push({
        type: "Feature", properties: {},
        geometry: { type: "LineString", coordinates: [[Z.lng, Z.lat], ende] }
      });
    });
    quelleSetzen("sv-strahlen", strahlen);
  }

  function sonneJetztZeichnen() {
    if (!Z.karte || !Z.karteBereit) return;
    if (Z.stand.elevation < 0) { quelleSetzen("sv-sonne", []); return; }
    quelleSetzen("sv-sonne", [{
      type: "Feature", properties: {},
      geometry: { type: "Point", coordinates: bahnPunkt(Z.stand.azimut, Z.stand.elevation) }
    }]);
  }

  /** Kartenlicht aus Sonnenazimut und -elevation; Intensitaet nach Sonnenhoehe. */
  function lichtSetzen() {
    if (!Z.karte || !Z.karteBereit || typeof Z.karte.setLight !== "function") return;
    var hoehe = Z.stand.elevation;
    var intensitaet = hoehe <= 0 ? 0.1 : 0.15 + 0.6 * Math.sin(hoehe * RAD);
    var farbe = hoehe <= 0 ? "#5b6480" : (hoehe < 8 ? "#ffd7a3" : "#ffffff");
    try {
      Z.karte.setLight({
        anchor: "map",
        color: farbe,
        intensity: Math.max(0.08, Math.min(0.85, intensitaet)),
        // [Radius, Azimut ab Nord im Uhrzeigersinn, Polarwinkel ab Zenit]
        position: [1.5, ((Z.stand.azimut % 360) + 360) % 360, Math.max(2, Math.min(178, 90 - hoehe))]
      });
    } catch (e) { /* aeltere MapLibre-Fassungen ohne setLight */ }
  }

  /* ---------------------------------------------------------------
     9. Verschattungsanalyse des Markerpunkts (10-Minuten-Raster)
     --------------------------------------------------------------- */
  function verschattungBerechnen() {
    Z.verschattung = null;
    if (!Z.zeiten || !Z.zeiten.aufgang || !Z.zeiten.untergang) return;
    if (!Z.gebaeude.length) return;

    var punkt = [Z.lng, Z.lat];
    // Kandidaten: fremde Gebaeude in Reichweite des laengsten Schattens
    var kandidaten = Z.gebaeude.filter(function (g) {
      if (Z.eigenes && g === Z.eigenes) return false;
      if (punktImPolygon(punkt, g.ring)) return false;
      return g.abstand <= SCHATTEN_MAX + 60;
    }).slice(0, 80);
    if (!kandidaten.length) {
      Z.verschattung = { intervalle: [], geprueft: true, gebaeude: 0 };
      return;
    }

    var t = isoZerlegen(Z.datum);
    var von = minutenSeitMitternacht(Z.zeiten.aufgang);
    var bis = minutenSeitMitternacht(Z.zeiten.untergang);
    var start = Math.ceil(von / SCHRITT_MIN) * SCHRITT_MIN;
    var intervalle = [], offen = null, m;

    for (m = start; m <= bis; m += SCHRITT_MIN) {
      var zeitpunkt = ortszeitZuDatum(t.jahr, t.monat, t.tag, Math.floor(m / 60), m % 60);
      var s = sonnenstand(zeitpunkt, Z.lat, Z.lng);
      var imSchatten = s.elevation <= 0.5;
      if (!imSchatten) {
        for (var i = 0; i < kandidaten.length; i++) {
          var g = kandidaten[i];
          // Grobfilter: Schatten dieses Gebaeudes kann den Punkt gar nicht erreichen
          var laenge = Math.min(SCHATTEN_MAX, g.hoehe / Math.tan(s.elevation * RAD));
          if (!isFinite(laenge) || g.abstand > laenge + 40) continue;
          var ring = schattenPolygon(g.ring, g.hoehe, s.azimut, s.elevation, g.mitte[1]);
          if (ring && punktImPolygon(punkt, ring)) { imSchatten = true; break; }
        }
      }
      if (imSchatten) { if (offen === null) offen = m; }
      else if (offen !== null) { intervalle.push([offen, m]); offen = null; }
    }
    if (offen !== null) intervalle.push([offen, bis]);
    Z.verschattung = { intervalle: intervalle, geprueft: true, gebaeude: kandidaten.length };
  }

  function minutenUhr(m) {
    var h = Math.floor(m / 60) % 24, r = Math.round(m % 60);
    return (h < 10 ? "0" : "") + h + ":" + (r < 10 ? "0" : "") + r;
  }

  function verschattungText() {
    if (!Z.webgl) return "Ohne 3D-Karte lässt sich die Verschattung durch Nachbargebäude nicht prüfen.";
    if (!Z.gebaeude.length) return "Keine Gebäudedaten im Ausschnitt – Verschattung nicht auswertbar.";
    var v = Z.verschattung;
    if (!v) return "Verschattung wird berechnet …";
    if (!v.intervalle.length) return "Ganztägig unverschattet – die Nachbarbebauung wirft an diesem Tag keinen Schatten auf den Standort.";
    return "Verschattet " + v.intervalle.map(function (iv) {
      return "von " + minutenUhr(iv[0]) + " bis " + minutenUhr(iv[1]) + " Uhr";
    }).join(", ") + ".";
  }

  /* ---------------------------------------------------------------
     10. Kompass-SVG mit Sonnenbogen, aktuellem Stand und Ausrichtung
     --------------------------------------------------------------- */
  function kompassPunkt(cx, cy, r, azimut) {
    return [cx + r * Math.sin(azimut * RAD), cy - r * Math.cos(azimut * RAD)];
  }

  function kompassZeichnen() {
    if (!E.kompassBox) return;
    var G = 240, cx = 120, cy = 120, R = 96;
    var teile = [];
    teile.push('<circle cx="120" cy="120" r="96" fill="#FAFAFA" stroke="' + CI.rand + '" stroke-width="1"/>');
    teile.push('<circle cx="120" cy="120" r="64" fill="none" stroke="' + CI.rand + '" stroke-width="1"/>');
    teile.push('<circle cx="120" cy="120" r="32" fill="none" stroke="' + CI.rand + '" stroke-width="1"/>');

    // Himmelsrichtungen
    HIMMELSRICHTUNGEN.forEach(function (r) {
      var a = kompassPunkt(cx, cy, R, r.grad), b = kompassPunkt(cx, cy, R - 8, r.grad);
      teile.push('<line x1="' + a[0].toFixed(1) + '" y1="' + a[1].toFixed(1) + '" x2="' + b[0].toFixed(1) +
                 '" y2="' + b[1].toFixed(1) + '" stroke="' + CI.muted + '" stroke-width="1"/>');
      var t = kompassPunkt(cx, cy, R + 12, r.grad);
      teile.push('<text x="' + t[0].toFixed(1) + '" y="' + (t[1] + 4).toFixed(1) + '" text-anchor="middle" ' +
                 'font-family="Montserrat,sans-serif" font-size="10" font-weight="600" fill="' +
                 (r.grad === 180 ? CI.gold : CI.muted) + '">' + r.kuerzel + '</text>');
    });

    // Ausrichtung der Terrasse als goldener Keil
    var k1 = kompassPunkt(cx, cy, R - 4, Z.ausrichtung - 22);
    var k2 = kompassPunkt(cx, cy, R - 4, Z.ausrichtung + 22);
    teile.push('<path d="M ' + cx + ' ' + cy + ' L ' + k1[0].toFixed(1) + ' ' + k1[1].toFixed(1) +
               ' A ' + (R - 4) + ' ' + (R - 4) + ' 0 0 1 ' + k2[0].toFixed(1) + ' ' + k2[1].toFixed(1) +
               ' Z" fill="' + CI.gold + '" opacity="0.18"/>');
    var kz = kompassPunkt(cx, cy, R - 4, Z.ausrichtung);
    teile.push('<line x1="' + cx + '" y1="' + cy + '" x2="' + kz[0].toFixed(1) + '" y2="' + kz[1].toFixed(1) +
               '" stroke="' + CI.gold + '" stroke-width="2.4"/>');

    // Sonnenbogen des Tages (Elevation -> Abstand zum Mittelpunkt)
    if (Z.zeiten) {
      var t = isoZerlegen(Z.datum), pfad = [], m;
      for (m = 0; m <= 1440; m += SCHRITT_MIN) {
        var s = sonnenstand(ortszeitZuDatum(t.jahr, t.monat, t.tag, Math.floor(m / 60), m % 60), Z.lat, Z.lng);
        if (s.elevation < 0) continue;
        var r = R * (1 - s.elevation / 90);
        var p = kompassPunkt(cx, cy, r, s.azimut);
        pfad.push(p[0].toFixed(1) + "," + p[1].toFixed(1));
      }
      if (pfad.length > 1) {
        teile.push('<polyline points="' + pfad.join(" ") + '" fill="none" stroke="' + CI.gold +
                   '" stroke-width="2" stroke-dasharray="4 3" opacity="0.9"/>');
      }
    }

    // Aktueller Sonnenstand
    if (Z.stand.elevation >= 0) {
      var rs = R * (1 - Z.stand.elevation / 90);
      var ps = kompassPunkt(cx, cy, rs, Z.stand.azimut);
      teile.push('<line x1="' + cx + '" y1="' + cy + '" x2="' + ps[0].toFixed(1) + '" y2="' + ps[1].toFixed(1) +
                 '" stroke="#F2C230" stroke-width="1.2" opacity="0.7"/>');
      teile.push('<circle cx="' + ps[0].toFixed(1) + '" cy="' + ps[1].toFixed(1) +
                 '" r="8" fill="#F2C230" stroke="#fff" stroke-width="2"/>');
    } else {
      teile.push('<text x="120" y="214" text-anchor="middle" font-family="Montserrat,sans-serif" ' +
                 'font-size="11" fill="' + CI.muted + '">Sonne unter dem Horizont</text>');
    }
    teile.push('<circle cx="120" cy="120" r="4" fill="' + CI.navy + '"/>');

    E.kompassBox.innerHTML = '<svg class="sv-kompass" viewBox="0 0 ' + G + ' ' + G +
      '" width="240" height="240" role="img" aria-label="Kompass mit Sonnenbogen">' + teile.join("") + '</svg>';
  }

  /* ---------------------------------------------------------------
     11. Kennzahlen, Exposé-Text
     --------------------------------------------------------------- */
  function panelAktualisieren() {
    var z = Z.zeiten;
    if (E.datumTitel) E.datumTitel.textContent = datumText(Z.datum);
    if (!z) return;
    E.kAufgang.textContent = z.aufgang ? uhrzeitText(z.aufgang) : "–";
    E.kUntergang.textContent = z.untergang ? uhrzeitText(z.untergang) : "–";
    E.kTageslaenge.textContent = minutenText(z.tageslaenge);
    E.kMaxHoehe.textContent = z.maxHoehe.toFixed(1) + "°";
    E.kAzimut.textContent = Z.stand.azimut.toFixed(0) + "° " + richtungKurz(Z.stand.azimut);
    E.kElevation.textContent = Z.stand.elevation.toFixed(1) + "°";
    E.kVerschattung.textContent = verschattungText();
    E.uhr.textContent = minutenUhr(Z.minuten);
    E.markeAuf.textContent = z.aufgang ? "Aufgang " + uhrzeitText(z.aufgang) : "";
    E.markeUnter.textContent = z.untergang ? "Untergang " + uhrzeitText(z.untergang) : "";
  }

  /** Automatischer Absatz fuers Exposé. */
  function exposeText() {
    var z = Z.zeiten;
    if (!z) return "";
    var d = isoZerlegen(Z.datum);
    var richtung = richtungName(Z.ausrichtung);
    var satz = [];
    satz.push("Ausrichtung nach " + richtung + " (" + Math.round(Z.ausrichtung) + "°)" +
              (Z.adresse ? " – " + Z.adresse : "") + ".");
    satz.push("Am " + d.tag + ". " + MONATE[d.monat - 1] +
              (z.aufgang ? " geht die Sonne um " + uhrzeitText(z.aufgang) + " Uhr auf" : " bleibt die Sonne unter dem Horizont") +
              (z.untergang ? " und um " + uhrzeitText(z.untergang) + " Uhr unter" : "") +
              "; das sind " + minutenText(z.tageslaenge) + " Tageslicht bei einer maximalen Sonnenhöhe von " +
              z.maxHoehe.toFixed(0) + "°.");

    // Abendsonne: steht die Sonne in der letzten Stunde noch auf der ausgerichteten Seite?
    if (z.untergang) {
      var sU = sonnenstand(z.untergang, Z.lat, Z.lng);
      var abstand = Math.abs(((sU.azimut - Z.ausrichtung + 540) % 360) - 180);
      if (abstand <= 100) {
        satz.push("Die Abendsonne steht bis zum Untergang um " + uhrzeitText(z.untergang) +
                  " Uhr auf der " + richtung.replace("en", "") + "-Seite – die Fläche wird bis zuletzt besonnt.");
      }
    }

    var v = Z.verschattung;
    if (!Z.webgl) {
      satz.push("Hinweis: Die Verschattung durch die Nachbarbebauung wurde auf diesem Gerät nicht geprüft.");
    } else if (!Z.gebaeude.length) {
      satz.push("Hinweis: Für den Ausschnitt liegen keine Gebäudedaten vor; die Nachbarbebauung wurde nicht geprüft.");
    } else if (v && !v.intervalle.length) {
      satz.push("Die umliegende Bebauung wirft an diesem Tag keinen Schatten auf den Standort – ganztägig unverschattet.");
    } else if (v) {
      satz.push("Die Nachbarbebauung verschattet den Standort " + v.intervalle.map(function (iv) {
        return "von " + minutenUhr(iv[0]) + " bis " + minutenUhr(iv[1]) + " Uhr";
      }).join(" und ") + "; in der übrigen Zeit liegt die Fläche in der Sonne.");
    }
    satz.push("(Berechnet für " + datumText(Z.datum) + ", Ortszeit Europe/Berlin, Position " +
              Z.lat.toFixed(5) + " / " + Z.lng.toFixed(5) + ".)");
    return satz.join(" ");
  }

  function textAktualisieren() {
    if (!E.text) return;
    var text = exposeText();
    E.text.value = text;
    // Portal mitteilen, damit der Absatz dort weiterverwendet werden kann
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ typ: "sonnenverlauf:text", text: text }, "*");
      }
    } catch (e) { /* Cross-Origin – ohne Folgen */ }
  }

  /* ---------------------------------------------------------------
     12. Ablauf: neu rechnen und alles nachziehen
     --------------------------------------------------------------- */
  function standBerechnen() {
    var t = isoZerlegen(Z.datum);
    var zeitpunkt = ortszeitZuDatum(t.jahr, t.monat, t.tag, Math.floor(Z.minuten / 60), Z.minuten % 60);
    Z.stand = sonnenstand(zeitpunkt, Z.lat, Z.lng);
  }

  function tagNeuSetzen(sliderNachziehen) {
    Z.zeiten = tagesZeiten(Z.datum, Z.lat, Z.lng);
    var auf = Z.zeiten.aufgang ? minutenSeitMitternacht(Z.zeiten.aufgang) : 0;
    var unter = Z.zeiten.untergang ? minutenSeitMitternacht(Z.zeiten.untergang) : 1439;
    if (unter <= auf) { auf = 0; unter = 1439; }
    var von = Math.ceil(auf / SCHRITT_MIN) * SCHRITT_MIN;      // erster Schritt nach dem Aufgang
    var bis = Math.floor(unter / SCHRITT_MIN) * SCHRITT_MIN;    // letzter Schritt vor dem Untergang
    if (bis < von) bis = von;
    E.slider.min = String(von);
    E.slider.max = String(bis);
    if (sliderNachziehen) {
      // Standard: Sonnenhoechststand, damit die Karte sofort etwas zeigt
      Z.minuten = Math.round((von + bis) / 2 / SCHRITT_MIN) * SCHRITT_MIN;
    }
    Z.minuten = Math.min(bis, Math.max(von, Math.round(Z.minuten / SCHRITT_MIN) * SCHRITT_MIN));
    E.slider.value = String(Z.minuten);
  }

  /** Vollstaendige Aktualisierung nach Positions-, Datums- oder Zeitwechsel. */
  function alleAktualisieren(schwer) {
    standBerechnen();
    lichtSetzen();
    sonneJetztZeichnen();
    if (schwer) { sonnenbahnZeichnen(); verschattungBerechnen(); }
    schattenPlanen(100);
    kompassZeichnen();
    panelAktualisieren();
    textAktualisieren();
  }

  /* ---------------------------------------------------------------
     13. Eingaben
     --------------------------------------------------------------- */
  function positionSetzen(lat, lng, opt) {
    opt = opt || {};
    Z.lat = lat; Z.lng = lng;
    if (!opt.adresseBehalten) { /* Adressfeld bleibt wie eingegeben */ }
    Z.osmBbox = null;          // neuer Ort - Merkbereich der letzten Abfrage verfaellt
    markerSetzen();
    if (Z.karte && opt.fliegen !== false) {
      Z.karte.flyTo({ center: [lng, lat], zoom: Math.max(Z.karte.getZoom(), 17), pitch: 60, duration: 900 });
    }
    tagNeuSetzen(false);
    gebaeudeSammeln();
    alleAktualisieren(true);
  }

  /** Adresse per Nominatim geocodieren. */
  function adresseSuchen() {
    var q = (E.adresse.value || "").trim();
    if (!q) { status("Bitte zuerst eine Adresse eingeben.", "fehler"); return; }
    status("Adresse wird gesucht …");
    E.suchen.disabled = true;
    /* Stufenweise vereinfachen: Ortsteil-Zusatz („… OT Kirch Rosin“) und Hausnummer kennt Nominatim oft nicht. */
    var varianten = [q];
    var ohneOt = q.replace(/\s+(OT|Ortsteil)\s+[^,]*/i, "");
    if (ohneOt !== q) varianten.push(ohneOt);
    var ohneNr = ohneOt.replace(/(\D)\s+\d+\s*[a-zA-Z]?(?=,|$)/, "$1");
    if (ohneNr !== ohneOt) varianten.push(ohneNr);
    var suche = function (i) {
      return fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" + encodeURIComponent(varianten[i]))
        .then(function (r) { return r.json(); })
        .then(function (j) { return (j && j.length) ? j : (i + 1 < varianten.length ? suche(i + 1) : null); });
    };
    suche(0)
      .then(function (j) {
        if (!j || !j.length) throw new Error("Die Adresse wurde nicht gefunden. Bitte Straße, Hausnummer, PLZ und Ort prüfen – oder den Standort direkt in die Karte klicken.");
        Z.adresse = j[0].display_name || q;
        status("Position gefunden: " + Z.adresse, "ok");
        positionSetzen(parseFloat(j[0].lat), parseFloat(j[0].lon), { fliegen: true });
      })
      .catch(function (e) {
        status(e && e.message ? e.message : "Die Adresssuche ist fehlgeschlagen (keine Verbindung?). Standort bitte in die Karte klicken.", "fehler");
      })
      .then(function () { E.suchen.disabled = false; });
  }

  function datumSetzen(iso) {
    if (!iso) return;
    Z.datum = iso;
    E.datum.value = iso;
    tagNeuSetzen(true);
    alleAktualisieren(true);
  }

  function ausrichtungSetzen(grad) {
    Z.ausrichtung = ((Math.round(grad) % 360) + 360) % 360;
    E.ausrichtung.value = String(Z.ausrichtung);
    kompassZeichnen();
    textAktualisieren();
  }

  /* ---- Zeitraffer ---- */
  function zeitrafferUmschalten() {
    if (Z.spielt) { zeitrafferStopp(); return; }
    var von = Number(E.slider.min), bis = Number(E.slider.max);
    var schritte = Math.max(1, Math.round((bis - von) / SCHRITT_MIN));
    var takt = Math.max(60, Math.round(ZEITRAFFER_MS / schritte));
    Z.spielt = true;
    E.play.textContent = "❚❚";
    if (Z.minuten >= bis) { Z.minuten = von; }
    Z.spielTimer = setInterval(function () {
      Z.minuten += SCHRITT_MIN;
      if (Z.minuten > bis) { Z.minuten = von; }
      E.slider.value = String(Z.minuten);
      alleAktualisieren(false);
    }, takt);
  }
  function zeitrafferStopp() {
    Z.spielt = false;
    if (Z.spielTimer) clearInterval(Z.spielTimer);
    Z.spielTimer = null;
    if (E.play) E.play.textContent = "▶";
  }

  /* ---- Zwischenablage und PNG ---- */
  function textKopieren() {
    var text = E.text.value || "";
    var fertig = function () { status("Text in der Zwischenablage.", "ok"); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(fertig).catch(function () { textKopierenAlt(text, fertig); });
    } else {
      textKopierenAlt(text, fertig);
    }
  }
  function textKopierenAlt(text, fertig) {
    try {
      E.text.focus(); E.text.select();
      document.execCommand("copy");
      fertig();
    } catch (e) {
      status("Kopieren nicht möglich – Text bitte markieren und mit Strg+C übernehmen.", "fehler");
    }
  }

  function pngSpeichern() {
    if (!Z.karte || !Z.webgl) { status("Ohne 3D-Karte ist kein Kartenbild verfügbar.", "fehler"); return; }
    try {
      Z.karte.triggerRepaint();
      var leinwand = Z.karte.getCanvas();
      var name = "Sonnenverlauf_" + Z.datum + "_" + minutenUhr(Z.minuten).replace(":", "-") + ".png";
      leinwand.toBlob(function (blob) {
        if (!blob) { status("Das Kartenbild konnte nicht erzeugt werden.", "fehler"); return; }
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = name;
        document.body.appendChild(a);
        a.click();
        setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
        status("Kartenbild gespeichert: " + name, "ok");
      }, "image/png");
    } catch (e) {
      status("Das Kartenbild konnte nicht erzeugt werden: " + (e && e.message ? e.message : e), "fehler");
    }
  }

  /* ---------------------------------------------------------------
     14. Ereignisse
     --------------------------------------------------------------- */
  function ereignisseBinden(behaelter) {
    E.suchen.addEventListener("click", adresseSuchen);
    E.adresse.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter") { ev.preventDefault(); adresseSuchen(); }
    });
    E.datum.addEventListener("change", function () { datumSetzen(E.datum.value); });
    E.slider.addEventListener("input", function () {
      zeitrafferStopp();
      Z.minuten = Number(E.slider.value);
      alleAktualisieren(false);
    });
    E.play.addEventListener("click", zeitrafferUmschalten);
    E.png.addEventListener("click", pngSpeichern);
    E.kopieren.addEventListener("click", textKopieren);
    E.ausrichtung.addEventListener("input", function () {
      ausrichtungSetzen(Number(E.ausrichtung.value) || 0);
    });
    E.osmfarben.addEventListener("change", function () {
      Z.osmFarben = !!E.osmfarben.checked;
      osmEbenenUmschalten();
      if (Z.osmFarben && !Z.osmGebaeude) { osmLaden(); }
      else { osmStatus(Z.osmFarben ? "" : "Neutrale Darstellung – Farben aus OpenStreetMap ausgeblendet."); }
      gebaeudeSammeln();
      schattenPlanen(0);
      analysePlanen(200);
    });
    E.drehen.addEventListener("click", function () {
      if (Z.karte) Z.karte.easeTo({ bearing: (Z.karte.getBearing() + 45) % 360, duration: 600 });
    });
    behaelter.addEventListener("click", function (ev) {
      var ziel = ev.target;
      if (!ziel || !ziel.getAttribute) return;
      var richtung = ziel.getAttribute("data-richtung");
      if (richtung !== null) {
        ausrichtungSetzen(Number(richtung));
        Array.prototype.forEach.call(behaelter.querySelectorAll("[data-richtung]"), function (b) {
          b.classList.toggle("aktiv", b === ziel);
        });
        return;
      }
      var schnell = ziel.getAttribute("data-schnelldatum");
      if (schnell !== null) {
        var jahr = isoZerlegen(Z.datum).jahr || new Date().getFullYear();
        datumSetzen(jahr + schnell);
        Array.prototype.forEach.call(behaelter.querySelectorAll("[data-schnelldatum]"), function (b) {
          b.classList.toggle("aktiv", b === ziel);
        });
      }
    });
  }

  /* ---------------------------------------------------------------
     15. Start
     --------------------------------------------------------------- */
  function init(behaelter, optionen) {
    var o = optionen || {};
    behaelter.innerHTML = markup();
    elementeSuchen();

    if (isFinite(Number(o.lat)) && isFinite(Number(o.lng)) && Number(o.lat) && Number(o.lng)) {
      Z.lat = Number(o.lat); Z.lng = Number(o.lng);
    }
    Z.adresse = o.adresse || "";
    if (isFinite(Number(o.ausrichtung))) Z.ausrichtung = ((Math.round(Number(o.ausrichtung)) % 360) + 360) % 360;

    E.adresse.value = Z.adresse;
    E.datum.value = Z.datum;
    E.ausrichtung.value = String(Z.ausrichtung);

    tagNeuSetzen(true);
    ereignisseBinden(behaelter);
    karteAufbauen();
    alleAktualisieren(true);

    // Adresse ohne Koordinaten: einmalig geocodieren
    if (Z.adresse && !(isFinite(Number(o.lat)) && Number(o.lat))) adresseSuchen();
    return { zustand: Z, karte: function () { return Z.karte; } };
  }

  return {
    init: init,
    sonnenstand: sonnenstand,
    tagesZeiten: tagesZeiten,
    schattenPolygon: schattenPolygon,
    konvexeHuelle: konvexeHuelle
  };
})();

/* Selbststart: Konfiguration kommt vom Portal (window.SV_KONFIG) oder bleibt leer. */
(function () {
  function start() {
    var k = window.SV_KONFIG || {};
    /* Objektseite (objekt.html): Lage kommt als URL-Parameter ?lat=&lng=&adresse= */
    if ((k.lat === undefined || k.lat === null) && window.location && window.location.search) {
      try {
        var q = new URLSearchParams(window.location.search);
        if (q.get("lat") && q.get("lng")) k = { lat: Number(q.get("lat")), lng: Number(q.get("lng")), adresse: q.get("adresse") || "", ausrichtung: q.get("ausrichtung") || undefined };
      } catch (e) { /* alte Browser – ohne Folgen */ }
    }
    Sonnenverlauf.init(document.getElementById("sv-app"), {
      lat: k.lat, lng: k.lng, adresse: k.adresse || "", ausrichtung: k.ausrichtung
    });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start);
  else start();
})();
</script>
