# ---------------------------------------------------------------------------
# Netlify-Konfiguration ImmoOffice.ai
# Ausfuehrlich: docs/DEPLOYMENT_NETLIFY.md
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# GEBAUT WIRD immoOffice.ai, NICHT DER ALTBESTAND (29.09.2026)
#
# Bis hierher stand hier die Next.js-Anwendung aus altbestand/: command
# "npm run build", publish ".next", dazu das Next-Plugin. Nach CLAUDE.md ist
# sie Altbestand und kein Produktbestandteil — und solange sie hier stand,
# hat jeder Bau aus dem Repository die ausgelieferte Oberflaeche wieder
# ueberschrieben. Genau das ist am 29.09.2026 passiert: auf der Seite stand
# die Registrierung des Altbestands, die eine Datenbankfunktion ruft
# (registriere_mandant), die es in diesem Projekt nicht gibt.
#
# Jetzt bauen beide Wege dasselbe: der Workflow
# .github/workflows/oberflaeche-ausliefern.yml und ein Bau aus dem
# Repository. Die beiden oeffentlichen Werte stehen weiterhin genau einmal
# hier; das Baukommando reicht sie unter den Namen weiter, die
# scripts/bauen.py liest.
# ---------------------------------------------------------------------------
[build]
  command = "IMMO_SUPABASE_URL=\"$NEXT_PUBLIC_SUPABASE_URL\" IMMO_SUPABASE_KEY=\"$NEXT_PUBLIC_SUPABASE_ANON_KEY\" python3 scripts/bauen.py && python3 tests/oberflaeche-rauchtest.py"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

  # -------------------------------------------------------------------------
  # Verbindung zur Datenbank.
  #
  # Diese beiden Werte stehen bewusst im Repository. Sie sind KEINE
  # Geheimnisse: Next setzt jede Variable mit dem Praefix NEXT_PUBLIC_ zur
  # Bauzeit fest in den Code ein, der Anon-Schluessel wird also ohnehin an
  # jeden Browser ausgeliefert. Der Schutz der Daten haengt nicht an diesem
  # Schluessel, sondern an der Row-Level-Security in der Datenbank.
  #
  # NICHT hierher gehoeren der Dienstschluessel, Stripe-Schluessel, der
  # Mailversand und der Verschluesselungsschluessel. Die umgehen die
  # Row-Level-Security oder kosten Geld und werden ausschliesslich in der
  # Netlify-Oberflaeche gesetzt (siehe .env.example).
  #
  # Zum Wechsel auf ein anderes Supabase-Projekt beide Zeilen entfernen und
  # die Werte in der Netlify-Oberflaeche setzen. Achtung: Werte aus dieser
  # Datei haben Vorrang vor der Oberflaeche, nicht umgekehrt.
  # -------------------------------------------------------------------------
  NEXT_PUBLIC_SUPABASE_URL = "https://usguiggfciavwzkdfjgt.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVzZ3VpZ2dmY2lhdnd6a2Rmamd0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQyOTE5NDcsImV4cCI6MjA5OTg2Nzk0N30.zVgnE4ZcERP6R5Fu9rC38N4NnZR3o2q4OISlZNstYJI"

  # Netlify durchsucht das Bauergebnis nach den Werten der Umgebungsvariablen
  # und bricht ab, wenn es sie findet. Genau das ist hier beabsichtigt: Der
  # Anon-Schluessel MUSS im ausgelieferten Code stehen, sonst kann der Browser
  # die Datenbank nicht erreichen. Nur diese beiden Namen sind ausgenommen.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY"

# Kein Next-Plugin mehr: es gehoerte zum Altbestand. immoOffice.ai ist eine
# einzelne index.html mit React ueber CDN — da gibt es nichts einzurichten.

# Hinweis: [[headers]] laesst sich in netlify.toml NICHT je Kontext setzen.
# Ein pauschales noindex haette auch die Produktion aus dem Index gehalten.
# Die Steuerung uebernimmt deshalb src/middleware.ts anhand von
# NEXT_PUBLIC_UMGEBUNG.

[context.production]
  [context.production.environment]
    NEXT_PUBLIC_UMGEBUNG = "produktion"

[context.deploy-preview.environment]
  NEXT_PUBLIC_UMGEBUNG = "vorschau"

[context.branch-deploy.environment]
  NEXT_PUBLIC_UMGEBUNG = "vorschau"
