# Supabase-Projektkonfiguration.
#
# Einziger Zweck bisher: fuer JEDE Edge Function festhalten, ob die Plattform
# vor dem Aufruf ein gueltiges JWT verlangt. Ohne diesen Eintrag setzt die
# Supabase-CLI verify_jwt = true — und damit waeren die 29 oeffentlich
# erreichbaren Funktionen tot: der Abmeldelink im Newsletter, die
# Objekt-Landingpage, der Lead-Eingang, der Bewerbertest.
#
# Woher die Werte stammen:
#   - 126 aus docs/EDGE_FUNCTIONS.md, dem Bestandsverzeichnis der Vorlage;
#   - 13 ohne Eintrag dort wurden aus ihren Auth-Markern bestimmt (prueft die
#     Funktion selbst ein Token, liest sie auth.getUser, ruft ein Cron-Job sie
#     ohne Authorization-Kopf auf?);
#   -  9 stillgelegte Funktionen stehen auf true, wie es ihr Kopfkommentar vom
#     23.09.2026 ausdruecklich festhaelt.
#
# Die Zahlen oben sind der Stand der Uebernahme (139 Funktionen). Seither
# sind onOffice, jotform und yodeck entfallen (CLAUDE.md, Phase 1.4), und
# die eigenen Funktionen aus supabase/eigene/ sind dazugekommen; ihr
# Eintrag steht dort, wo er alphabetisch hingehoert, mit Begruendung.
#
# Wer einen Wert aendert, oeffnet oder schliesst eine Tuer ins Projekt. Das
# gehoert in den Diff und nicht in die Oberflaeche von Supabase.

project_id = "usguiggfciavwzkdfjgt"


